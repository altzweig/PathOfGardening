  shield:      { files: [shield_zap], vol: 0.25, pitch: [0.9, 1.2], gap: 0.3 }                    # Schild lädt neu
  die:         { files: [sheep_baa_2, sheep_baa_3], vol: 0.28, pitch: [0.7, 0.8], gap: 0.1 }

hedgehog:
  # Igel: nutzt vorerst Waschbär-Laute, sehr hoch und leise (Schnüffeln/Quieken); Aufplustern = kurzes Fauchen + Rascheln
  wave:        { files: [rac_wave_1, rac_wave_2, rac_wave_3], vol: 0.2, pitch: [1.6, 1.8], gap: 0.6 }
  steal:       { files: [berry_1, berry_2, berry_3, berry_4], vol: 0.14, pitch: [0.8, 0.95], gap: 0.25, lp: 2500 }   # frisst eine Beere
  attack:      { files: [rac_hiss, rip_1, rip_2], vol: 0.12, pitch: [1.4, 1.7], gap: 0.4 }                          # plustert sich auf
  fieldAttack: { files: [rip_1, rip_2, rip_3], vol: 0.1, pitch: [1.3, 1.5], gap: 0.6 }
  die:         { files: [rac_die_1, rac_die_2], vol: 0.24, pitch: [1.5, 1.7], gap: 0.15 }

squirrel:
  # Eichhörnchen: Waschbär-Laute sehr hoch und schnell (Keckern), Rascheln in der Krone beim Erscheinen
  wave:   { files: [rip_1, rip_2, rip_3], vol: 0.22, pitch: [1.5, 1.8], gap: 0.4 }                     # raschelt aus der Baumkrone
  attack: { files: [rac_attack_1, rac_attack_2, rac_attack_3], vol: 0.2, pitch: [1.9, 2.2], gap: 0.4 }  # keckert oben am Kronenrand, bevor es springt
  steal:  { files: [wood_1, wood_3, wood_5], vol: 0.2, pitch: [1.6, 1.9], gap: 0.15 }                 # schnappt sich eine Nuss
  flee:   { files: [rac_flee_1, rac_flee_2, rac_flee_3], vol: 0.24, pitch: [1.8, 2.1], gap: 0.4 }
  laugh:  { files: [rac_laugh_1, rac_laugh_2], vol: 0.35, pitch: [2.5, 2.8], gap: 2 }
  die:    { files: [rac_die_1, rac_die_2], vol: 0.24, pitch: [1.8, 2.0], gap: 0.15 }

player:
  step:   { files: [step_1, step_2, step_3, step_4], vol: 0.16, pitch: [0.85, 1.15], gap: 0.12 }
  hurt:   { synth: hurt, gap: 0.2 }
  die:    { synth: playerDie, gap: 1 }
  spawn:  { synth: respawn, gap: 0.5 }

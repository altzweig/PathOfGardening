    shotgun: Schrotflinte
    crossbow: Armbrust
    sling: Schleuder
    mace: Streitkolben
    cannon: Kanone
  buildings:
    house: Haupthaus
    well: Brunnen
    shop: Hofladen
    mill: Mühle
    bakery: Bäckerei

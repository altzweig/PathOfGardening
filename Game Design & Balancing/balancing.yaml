    raccoon: Waschbär
    hare: Hase
  livestock:
    cow: Kuh
    sheep: Schaf
    goat: Ziege
    chicken: Huhn

# ---------------------------------------------------------------------
day:
  length: 480              # s pro Tag (Basti 20.11.2026: 8 min)
  clock: [6, 20]           # angezeigte Uhrzeit von Tagesbeginn bis Abend (nur Sonnen-Uhr im HUD)
  light: [2.6, 16.0]       # Lichtstunde (2.6 = heller Morgen .. 16 = Sonnenuntergang) am Anfang und Ende des Tages
  fade: 1.4                # s Schwarzblende am Abend / bei Ohnmacht
  rain:                    # seltener Sommer-Gewitterschauer (gießt alle Felder und den Busch)
    chance: 0.15           # Wahrscheinlichkeit pro Tag (nicht am Tutorial-Tag)
    duration: [20, 32]     # s

player:
  hp: 100
  speed: 4.6               # m/s
  radius: 0.35             # m, Kollision
  reach: 1.7               # m bis zum Ziel, ab hier startet eine Aktion (sonst läuft die Figur erst hin)
  kneel: 0.7               # m: Arbeit am Boden (Jäten, Säen, Ernten am Feld, Sammeln) - so nah kniet man sich an die Stelle, sonst geht man erst hin
  leave: 1.25              # x reach (am Boden x kneel + 0,35 m): entfernt man sich während einer Aktion weiter, bricht sie ab
  actionSpeed: 2.2         # m/s Laufen während einer Aktion im Stehen (Gießen, Füttern ...)
  crouchSpeed: 1.15        # m/s Watscheln in der Hocke (Aktionsknopf gehalten nach Jäten, Säen, Ernten am Boden)
  actionGap: 0.5           # s Pause zwischen zwei automatischen Arbeitsschritten (Wiederholung oder Aktionsknopf gehalten), erst dann geht es weiter (Basti 21.11.2026)
  nextField: 5            # m: Aktion weiter gehalten und am Feld gibt es nichts mehr zu tun -> man geht von selbst zum nächsten Feld mit Arbeit in dieser Entfernung
  hover: 2.6               # m: Handy-Aktionsknopf nimmt das nächste Ziel in dieser Entfernung
  pickupRadius: 0.9        # m: fallengelassene Beute wird eingesammelt
  magnetRadius: 3          # m: ab hier rollt Beute zum Spieler
  magnetSpeed: 7           # m/s
  hurtStun: 0.25           # s kurzes Zusammenzucken bei einem Biss (bricht die Aktion ab)

# ---------------------------------------------------------------------
# Aktionen tagsüber (außer Kämpfen). Steht man im Radius eines Ziels (player.hover), wird "[Aktionsname]" eingeblendet,
# Linksklick führt sie aus, ein kleiner Zeitbalken läuft voll. time = Dauer in s, label = eingeblendeter Name.
# repeat: läuft von selbst weiter, solange es geht (Busch abernten, Wasser schöpfen ...).
# Aktionsknopf / linke Maustaste GEHALTEN (21.11.2026): nach jeder Aktion startet die nächste mögliche am anvisierten Ziel,
# gibt es keine, endet die Kette. Laufen während einer Aktion geht (langsamer), zu weit weg (player.leave) bricht ab.
actions:
  water:       { time: 2.0, label: Gießen }           # Busch / Feld: Feld einmal nach dem Säen, dann wächst es
  repair:      { time: 10.0, label: Reparieren }      # zertrampeltes Feld nach der Nacht wieder herrichten (Basti 21.11.2026: 10 s pro Feld)
  sow:         { time: 2.0, label: Säen }             # leeres Feld (auch direkt nach der Ernte, ohne Jäten/Harken), kostet kein Saatgut
  weed:        { time: 1.0, label: Jäten, repeat: true }  # Feld: kniend mit der Handharke, je Durchgang 1 Unkraut -> 1 Grünschnitt
  fertilize:   { time: 1.5, label: Düngen }           # Feld: 1x am Tag, braucht 1 Dünger
  harvestPlot: { time: 1.33, label: Ernten, repeat: true }  # reifes Feld, so oft wie crops.*.cuts, dann abgeerntet
  harvestBush: { time: 1.33, label: Ernten, repeat: true }  # Blaubeerbusch
  refill:      { time: 1.0, label: Kanne füllen, repeat: true }  # Brunnen: je Füllen can.perFill Ladungen, läuft bis die Kanne voll ist (21.11.2026: 1 s statt 2 s)
  draw:        { time: 1.5, label: Wasser schöpfen, repeat: true }  # Brunnen -> Fass, bis das Fass voll ist
  gather:      { time: 1.33, label: Sammeln, repeat: true }  # Pilze, Brennholz, Steine am Hofrand
  weedHof:     { time: 1.0, label: Jäten }            # Wildkräuter auf dem Hof -> Grünschnitt oder Kräuter (wild.herbs)
  pickWild:    { time: 1.33, label: Pflücken, repeat: true }  # wilder Brombeerstrauch
  shake:       { time: 1.33, label: Schütteln, repeat: true } # Obst-/Nussbaum: reife Früchte fallen herunter
  feed:        { time: 2.0, label: Füttern }          # Stall: alle Tiere einmal füttern
  straw:       { time: 2.0, label: Stroh auslegen }   # Stall: 1x am Tag, frisches Stroh = mehr Ertrag
  milk:        { time: 3.0, label: Melken }           # Kühe, Schafe, Ziegen
  eggs:        { time: 2.0, label: Eier sammeln }     # Hühner

can:                       # Gießkanne (Basti 21.11.2026: 3x füllen = voll)
  capacity: 6              # Ladungen (eine Ladung = einmal gießen), mehr Wasser geht nicht in die Kanne
  perFill: 2               # Ladungen pro Füllen am Brunnen (actions.refill.time)
  start: 6                 # Tutorial-Tag: voll

bush:                      # Blaubeerbusch (mehrjährig, jeden Tag): gießen -> reifen -> ernten -> leer bis morgen
  ripen: 40                # s nach dem Gießen bis erntereif (Fruchttabelle)
  picks: 3                 # Erntevorgänge (je actions.harvestBush.time) ...
  berries: 5               # ... mit so vielen Beeren, dann ist der Busch leer
  radius: 0.8              # m Kollision: man steht knapp davor, nicht im Busch
  barDelay: 1              # s nach dem Gießen erscheint der dezente Reife-Balken
  almostAt: 0.75           # Anteil der Reifezeit: Tutorial-Hinweis "fast erntereif"

# Feldfrüchte (einjährig) aus Bastis Fruchttabelle, 20.11.2026. Zyklus auf jedem Feld:
#   Säen 2 s (kostenlos) -> 1 s sieht man die Pflanze sprießen -> Gießen 2 s -> grow s wachsen -> cuts x Ernten (je 1,33 s)
#   -> 1 s abräumen, dann ist das Feld wieder bereit. Also etwa 10 s + grow pro Durchgang.
# name = Anzeige über dem Feld (nur in der Nähe), level = ab diesem Level säbar, rarity = Seltenheit (Common/Uncommon/Rare), yield = pro Erntevorgang.
crops:                     # Feldfrüchte aus Bastis Fruchttabelle (Stand 21.11.2026). Jedes Feld hat eine feste Frucht.
  # Vorerst gibt es nur Commons (Startfelder + Level-up-Felder); Uncommon/Rare muss man später finden oder kaufen.
  wheat:    { name: Weizen, rarity: Common,   grow: 60,  cuts: 3, yield: { wheat: 5, straw: 1 } }
  carrot:   { name: Karotte, rarity: Common,   grow: 80,  cuts: 3, yield: { carrot: 1 } }
  potato:   { name: Kartoffel, rarity: Common,   grow: 100, cuts: 3, yield: { potato: 3 } }
  onion:    { name: Zwiebel, rarity: Common,   grow: 60,  cuts: 3, yield: { onion: 1 } }
  garlic:   { name: Knoblauch, rarity: Common,   grow: 50,  cuts: 3, yield: { garlic: 1 } }
  pea:      { name: Erbsen, rarity: Common,   grow: 80,  cuts: 3, yield: { pea: 5 } }
  celery:   { name: Sellerie, rarity: Common,   grow: 70,  cuts: 3, yield: { celery: 1 } }
  cab:      { name: Kohl, rarity: Common,   grow: 220, cuts: 3, yield: { cab: 1 } }
  radish:   { name: Radieschen, rarity: Uncommon, grow: 80,  cuts: 3, yield: { radish: 2 } }
  bean:     { name: Bohnen, rarity: Uncommon, grow: 100, cuts: 3, yield: { bean: 3 } }
  leek:     { name: Lauch, rarity: Uncommon, grow: 90,  cuts: 3, yield: { leek: 1 } }
  strawb:   { name: Erdbeeren, rarity: Uncommon, grow: 70,  cuts: 3, yield: { strawb: 3 } }
  lettuce:  { name: Salat, rarity: Uncommon, grow: 70,  cuts: 3, yield: { lettuce: 1 } }
  corn:     { name: Mais, rarity: Uncommon, grow: 120, cuts: 3, yield: { corn: 1 } }
  pepper:   { name: Paprika, rarity: Uncommon, grow: 130, cuts: 3, yield: { pepper: 1 } }
  tomato:   { name: Tomate, rarity: Uncommon, grow: 140, cuts: 3, yield: { tomato: 1 } }
  zucchini: { name: Zucchini, rarity: Uncommon, grow: 130, cuts: 3, yield: { zucchini: 1 } }
  eggplant: { name: Aubergine, rarity: Uncommon, grow: 150, cuts: 3, yield: { eggplant: 1 } }
  asp:      { name: Spargel, rarity: Rare,     grow: 180, cuts: 3, yield: { asp: 1 } }
  pumpkin:  { name: Kürbis, rarity: Rare,     grow: 400, cuts: 3, yield: { pumpkin: 1 } }
  melon:    { name: Melone, rarity: Rare,     grow: 440, cuts: 3, yield: { melon: 1 } }
  chili:    { name: Chili, rarity: Rare,     grow: 320, cuts: 3, yield: { chili: 3 } }
  rhubarb:  { name: Rhabarber, rarity: Rare,     grow: 360, cuts: 3, yield: { rhubarb: 1 } }
  fennel:   { name: Fenchel, rarity: Rare,     grow: 230, cuts: 3, yield: { fennel: 1 } }

# XP pro Erntevorgang (Basti 21.11.2026, Formel aus der Fruchttabelle):
#   XP pro Ernte = Seltenheit x (Feldzeit + workWeight x Arbeitszeit) / div, gerundet auf ganze XP pro Vorgang
#   Feldzeit = Wachstum + pause (Feldfrüchte), sonst pauschal pause; Arbeitszeit = Säen + Gießen + Vorgänge x cut
harvestXp:
  pause: 10                # s Laufwege/Handgriffe pro Durchgang
  sow: 2                   # s Säen (nur Feldfrüchte)
  water: 2                 # s Gießen (Feldfrüchte, Blaubeerbusch)
  cut: 1.33                # s pro Erntevorgang
  workWeight: 2            # aktive Arbeit zählt doppelt
  div: 3
  rarity: { Common: 1, Uncommon: 1.3, Rare: 1.6 }
  other:                   # Ernten ohne Feld: Seltenheit und ob gegossen wird (Busch, Bäume, Sträucher, wilde Pflanzen)
    blue:      { rarity: Common, water: true }
    apple:     { rarity: Common }
    nut:       { rarity: Common }
    bramble:   { rarity: Common }
    baerlauch: { rarity: Common }
    dandel:    { rarity: Uncommon }
    sorrel:    { rarity: Uncommon }
    mushroom:  { rarity: Uncommon }

# Mehrjährige Kulturen aus der Tabelle, die noch keinen Platz auf dem Hof haben (kommen später):
#   Preiselbeeren (Uncommon, alle 2 Tage, 3 x 5), Zitronen (Rare, alle 3 Tage, 3 x 1), Stachelbeeren (Rare, alle 2 Tage, 3 x 5)

plots:
  size: 2.6                # m Durchmesser eines Feldes (natürlich wirkendes Sechseck ohne harte Kante)
  # Basti 21.11.2026: Wachstumsbalken, Restzeit und Name der Pflanze nur, wenn man nah dran ist (auch am Blaubeerbusch)
  info: { near: 2.6, far: 3.6, fade: 0.25 }   # m voll sichtbar / m ausgeblendet, s weiches Ein-/Ausblenden
  # Unkraut (Basti 21.11.2026): wächst NUR morgens, nie zwischendurch. Jeden Morgen kommen pro Feld 0/1/2 dazu
  # (morning = Wahrscheinlichkeiten für 0, 1, 2), höchstens max. Jedes Unkraut bremst das Wachstum (slow = bei 1, 2, 3 Unkraut).
  sprout: 1                # s nach dem Säen: die Pflanze sprießt sichtbar, erst dann kann man gießen
  clear: 1                 # s nach der letzten Ernte, dann ist das Feld wieder bestellbereit
  fertBonus: 0.3           # je Düngen (1x pro Tag): 30 % mehr Ernte-Durchgänge
  weeds: { max: 3, morning: [0.25, 0.5, 0.25], slow: [0.05, 0.10, 0.15] }
  # Felder kann man nicht kaufen (Basti 21.11.2026): jedes Level-up gibt genau 1 Feld, es wird automatisch platziert.
  # Erstes Level-up: Wahl aus 3 zufälligen Commons, die man noch nicht hat. Danach: 1 zufälliges Common (auch vorhandene).

storage:
  capacity: 999            # pro Ware (Lager-Ausbau kommt später)

wild:                      # was auf dem Hof von selbst wächst (nie im Sichtbereich des Spielers)
  weeds: { start: 40, max: 100, every: [6, 12] }      # Wildkräuter-Büschel auf dem Hof, wachsen rund um die dichten Grasflächen
  # Wildkräuter (Basti 21.11.2026): Unkraut, Bärlauch, Löwenzahn und Sauerampfer sind EINE Pflanze (ein Büschel aus kleinen Pflanzen).
  # Jäten = 1 Roll + rolls weitere: Roll 1 gibt zu (1 - pair) 1 Unkraut (= 1 Grünschnitt), zu pair 2 gleiche zufällige Kräuter.
  # Jeder weitere Roll: je chance für jedes Kraut (also 10 % Bärlauch, 10 % Löwenzahn, 10 % Sauerampfer, 70 % nichts). Bis zu 4 Kräuter.
  herbs:
    kinds: [baerlauch, dandel, sorrel]
    pair: 0.1
    rolls: 2
    chance: 0.1
    xpPicks: 3             # XP pro gefundenem Kraut wie früher beim 3x-Sammeln (Bärlauch 2, Löwenzahn/Sauerampfer 3), Unkraut gibt keine XP
  forage:                  # Sammeln, am Anfang liegt einiges herum (halb so viel wie vorher)
    start: 20
    max: 35
    every: [6, 12]         # s bis das nächste Ding nachwächst
    band: [0.84, 0.96]     # Waldrand-Streifen (Anteil der Ellipse)
    items: { wood: 3, stone: 2 }   # Gewichte für Brennholz und Steine (alle every s eins)
    plants:                # wilde Pflanzen (Fruchttabelle): alle spawn s wächst eine nach, picks x Sammeln je picks 1
      mushroom:  { spawn: 70, picks: 3 }   # Bärlauch, Löwenzahn, Sauerampfer stecken seit 21.11.2026 in den Wildkräutern (wild.herbs)
    where:                 # wo was wächst: edge = Waldrand, wet = feuchte Wiese hinter dem Brunnen, grass = Rand der dichten Grasflächen
      wood: [edge]
      mushroom: [edge]
      stone: [edge]
  brambles: { count: 5, every: 2, picks: 3, pick: 5 }   # wilde Brombeeren: alle 2 Tage reif, 3x Pflücken je 5 Beeren
  trees: [apple, apple, nut]   # Bäume auf dem Hof der Reihe nach: Apfel, Apfel, Nuss, Apfel ...
  apples: { every: 1, picks: 3, shake: 2 }   # Apfelbaum: jeden Tag, 3x Schütteln, je 2 Äpfel fallen herunter
  nuts: { every: 3, picks: 3, shake: 3 }     # Nussbaum: alle 3 Tage, 3x Schütteln, je 3 Nüsse
  barrel: 10               # Fass am Brunnen fasst so viel Wasser

grass:                     # wilde Grasgruppen: wachsen nur, wo keiner läuft oder mäht (hinter dem Brunnen, Gebäuderückseiten, geschlossene Zaunseiten, Waldrand, unter Obstbäumen nur niedrig)
  perM2: 24                # Gras-Büschel (je 16 Dreiecke) pro m² bei voller Dichte (Grafik mittel 55 %, niedrig 30 %)
  well: 1                  # Größe der feuchten Wiese hinter dem Brunnen
  back: 1                  # Breite der Streifen an Gebäuderückseiten
  edge: 40                 # Anzahl Gruppen am Waldrand

texturen:                  # Texturkonzept (20.11.2026): FreeStylized, KTX2. Kachel = Meter pro Texturwiederholung.
  gelaende:                # Boden: Splatmap (r Moos, g Feld, b Pfad, a Pflaster) über Gras, Trockengras per Rauschen
    kachel: { gras: 3.5, moos: 3, feld: 3, pfad: 2.6, trocken: 3.8, pflaster: 2.2 }
    mischschaerfe: 2.5     # Übergänge zwischen den Layern: 1 = sehr weich .. 6 = hart
    rauschen: 0.55         # wie stark die Ränder der Splatmap ausfransen (0 = glatt)
    farbvariation: 0.3     # großflächige Hell/Dunkel- und Farbschwankung (0 = aus)
    normalstaerke: 0.9     # Relief der Normal-Maps (auf Grafik niedrig und am Handy aus)
  gebaeude:                # Gebäude und Felsen: tri-planar, Kachel = Meter pro Wiederholung
    kachel: { holz: 2, holzSchuppen: 1.6, dach: 2.2, stein: 1.8 }
    normalstaerke: 1

stalls:                    # Füttern am Stall (Linksklick), nicht einzelne Tiere. Morgens (1. Tageshälfte) und abends (2.) je einmal Ertrag.
  strawBonus: 0.3          # frisches Stroh (1x am Tag): 30 % mehr Ertrag
  strawCost: 1             # Stroh pro Auslegen
  cows:     { animals: [cow, cow], feed: green, feedCost: 2, maxFed: 3, collect: milk, yield: { milk: 2, slurry: 1 } }
  sheep:    { animals: [sheep, goat], feed: green, feedCost: 2, maxFed: 2, collect: milk, yield: { milk: 1 } }
  chickens: { animals: [chicken, chicken, chicken, chicken], feed: wheat, feedCost: 1, maxFed: 1, collect: eggs, yield: { egg: 1 } }
  # yield = pro Tier bei vollem Futter (weniger Futter = anteilig weniger), feedCost = Ware pro Füttern für den ganzen Stall

saves:                     # Spielstände: lokal im Browser (localStorage), mehrere mit Namen, keine Cloud
  autosave: 300            # s Autospeichern während des Spiels (Basti: alle 5 Minuten); zusätzlich bei jedem Tageswechsel
  nameMax: 24              # Zeichen im Spielstandnamen

start:                     # neuer Spielstand
  money: 0                 # Gefallen
  items: {}
  plots: [wheat, cab, onion]   # Startfelder mit fester Frucht (Basti 21.11.2026), dazu der Blaubeerbusch

# ---------------------------------------------------------------------
# Kampf (Rechtsklick). Morgens wählt man genau eine Waffe und eine Munition.
weapons:
  rake:                    # Handharke (einhändig, immer dabei): Schlag mit Rechtsklick / Angriffsknopf
    damage: 4
    range: 1.35            # m
    arc: 120               # Grad Trefferkegel (Basti 21.11.2026)
    cooldown: 0.5          # s
    swing: 0.2             # s Schwung (Treffer in der Mitte)
    knockback: 0.5         # m
    stun: 0.4              # s (Speed linear von 0 auf normal)
  shotgun:
    available: true
    level: 1
    ammo: [blue, wheat, nut, garlic]     # Beeren, Körner, Nüsse, Knoblauch
    ammoPerShot: 1
    cooldown: 0.7
    pellets: 6
    cone: 26               # Grad Streuung
    range: 7               # m
    speed: 20              # m/s Schrot
    damage: 2              # je Schrotkugel (x Munitionsfaktor)
  crossbow:                # vorbereitet, noch gesperrt
    available: false
    level: 4
    ammo: [asp, bean, leek, carrot]
  sling:
    available: false
    level: 3
    ammo: [garlic, nut, lemon, apple]
  mace:
    available: false
    level: 6
    ammo: [cab, pumpkin, melon]
  cannon:
    available: false
    level: 8
    ammo: [cab, pumpkin, melon]

ammo:                      # Wirkung je Munition: damage = Faktor auf den Waffenschaden, freeze = s eingefroren (Blaubeeren)
  blue: { damage: 1, freeze: 2.5 }
  wheat: { damage: 0.6 }
  nut: { damage: 1.4 }
  garlic: { damage: 1.1 }

# ---------------------------------------------------------------------
# Tiere: wenige, kleine Schübe. Sie werden nicht getötet, sondern vertrieben (0 Leben = Flucht in den Wald, XP).
animals:
  raccoon:
    hp: 12
    speed: 2.4             # m/s beim Anschleichen
    fleeSpeed: 3.4         # m/s auf der Flucht (langsamer als der Spieler)
    radius: 0.35
    stealInterval: 0.8     # s pro geklauter Ware
    carryMax: 4            # klaut höchstens so viel, dann flieht er
    shy: 0.35              # Anteil scheuer Waschbären: hauen ab, sobald man näher als `scare` kommt
    scare: 3.5             # m
    aggro: 3               # m: mutige Waschbären greifen den Spieler an, wenn er so nah ist
    damage: 6              # pro Biss
    biteInterval: 1.2      # s
    biteRange: 0.85        # m
    xp: 8
  hare:
    hp: 6
    speed: 2.6
    fleeSpeed: 6.5
    radius: 0.25
    scare: 4.5             # m: so nah darf man kommen (Basti 21.11.2026: Hasen stehlen nichts, sie hoppeln nur nahe den Feldern herum)
    run: 15                # m: beim ersten Erschrecken laufen sie so weit weg ...
    away: 60               # s: ... beim zweiten verlassen sie den Hof und kommen nach so vielen Sekunden wieder
    eatInterval: 2.5       # (nicht mehr benutzt)
    plotBites: 3           # (nicht mehr benutzt)
    xp: 3

spawns:
  wanderers: [1, 2]        # so viele Hasen hoppeln ab dem Morgen nahe den Feldern herum
  wanderTypes: { hare: 1 } # Gewichte
  raid:                    # genau ein Waschbär-Angriff pro Tag, zufällig in der 2. Tageshälfte
    from: 0.5              # Anteil des Tages
    to: 0.88
    raccoons: 0            # 21.11.2026: vorerst keine Waschbären (kommen später mit höherem Level) ...
    perLevel: 0            # ... + je weiterem Level so viele mehr
  scaling:                 # Schwierigkeit steigt mit dem Level: + Anteil je Level über 1
    hp: 0.12
    damage: 0.1
    speed: 0.03

faint:                     # 0 Leben = ohnmächtig (Basti 21.11.2026): Cutscene, man wacht abends auf, der schlimmste Fall tritt ein
  loseHarvest: true        # die gesamte Ernte des Tages ist weg (auch was Tiere tragen oder am Boden liegt)
  breakFields: true        # alle Felder sind zertrampelt und müssen repariert werden

night:                     # Nachtangriff nach jedem Tag (Basti 21.11.2026): statt ins Haus beginnt ein Countdown, Tiere greifen den Hof an
  length: 120              # s Countdown der Nacht, danach geht es ins Haus (Abend-UI)
  dusk: 8                  # s vom Sonnenuntergang bis zur dunklen Nacht (Licht)
  warn: 5.5                # s steht die Warnung "Die Nacht bricht herein" (mit Soundeffekt)
  light: [16.0, 20.6]      # Lichtstunde bei Einbruch der Nacht / ab `dusk` (20.6 = Mondlicht)
  flee: 4                  # s vor Ende der Nacht hauen alle Tiere ab
  waves:                   # Nacht 1: drei Wellen (at = s nach Einbruch der Nacht)
    - { at: 6,  hare: 1, raccoon: 1 }
    - { at: 44, hare: 1, raccoon: 2 }
    - { at: 80, hare: 2, raccoon: 3 }
  grow: 1                  # jede weitere Nacht pro Welle so viele Tiere mehr (abwechselnd Waschbär, Hase)
  max:                     # höchstens so viele Tiere in einer Nacht: base + perLevel x (Level - 1), damit es mit niedrigem Level nicht zu schwer wird
    base: 10
    perLevel: 4
  hare:                    # aggressiver Hase (rote Augen): frisst Felder an, haut erst ab, wenn sein Leben weg ist
    hp: 8                  # Handharke macht 4 Schaden: 2 Treffer (+ Level-Skalierung spawns.scaling)
    speed: 3.0             # m/s
    biteInterval: 1.2      # s pro Biss ins Feld
    plotDamage: 1          # Feld-Lebenspunkte pro Biss
    xp: 4
  raccoon:                 # Waschbär (funkelnde blaue Augen): greift den Spieler an und klaut bei jedem Treffer Ernte aus der Tasche
    hp: 16                 # 4 Treffer mit der Handharke
    speed: 2.9             # m/s (Spieler läuft 4,6)
    damage: 8              # pro Biss
    biteInterval: 1.3      # s
    steal: 0.12            # jeder Biss klaut diesen Anteil der heutigen Ernte (mind. 1 Stück)
    bites: 3               # nach so vielen Treffern haut er mit der Beute ab (Treffer auf ihn: er lässt alles fallen)
    xp: 10
  plotHp: 12               # Lebenspunkte eines Feldes in der Nacht; bei 0 zertrampelt (Pflanzen kaputt, 10 s reparieren)
  brokenShow: 0.06         # so weit ist der rote Balken eines zertrampelten Feldes gefüllt

# ---------------------------------------------------------------------
levels:
  # Basti 21.11.2026: grob alle 2-3 Tage ein Level, Level 2 schon an Tag 1. Ernte-XP pro Tag wachsen mit den Feldern
  # (je Feld realistisch ca. 125 XP/Tag, Level L hat L+2 Felder), daher Abstand ca. 2,5 Tage x 125 x (L+2).
  xp: [0, 250, 1500, 3050, 4950, 7100, 9600, 12400, 15500, 19000]   # XP ab Level 1, 2, 3, ...
  unlocks:                 # was ein Level freischaltet (Gebäude-Ids; dazu gibt jedes Level-up 1 Feld)
    2: [shop]
    3: [mill, juicer]
    4: [bakery]
    5: [carpentry, workshop]
    6: [dairy, cows, chickens, sheep]
    7: [silo]

quests:                    # Tagesaufträge (Basti 21.11.2026): morgens automatisch angenommen, abends verfallen die offenen
  daily:
    count: 3               # Aufträge pro Tag, alle zusammen an einem Tag schaffbar
    load: 0.55             # Anteil der Feld-Sekunden des Tages (Felder x Taglänge), den die 3 Aufträge zusammen belegen
    cycle: 10              # s Arbeit pro Feld-Durchgang ohne Wachstum (Säen, Keimen, Gießen, Ernten, Räumen)
    objectives: [1, 1, 2, 2, 2, 3]   # höchstens so viele Ziele pro Auftrag auf Level 1, 2, 3, ...
    blue: { max: 10, min: 5, sec: 8 }  # Blaubeeren (Busch gibt 15, der Waschbär klaut bis zu 4): höchstens so viele pro Tag, kleinstes Ziel, zählen wie s Feldarbeit pro Beere
    daysPerLevel: 2.5      # Tage pro Level ...
    xpShare: 0.1           # ... davon kommt dieser Anteil der XP aus Aufträgen (der Rest aus Ernten)
    money: 0.12            # Taler pro Feld-Sekunde Arbeit ...
    moneyLevel: 0.15       # ... plus so viel Anteil je Level über 1
    minMoney: 15           # mindestens so viele Taler pro Auftrag (Tag 1 ohne Brunnen: kleine Aufträge, trotzdem reicht es abends für die Reparatur)
  titles:                  # 3-5 Wörter; {item} = Name der Ware
    one: ["{item} für den Markt", "Eine Kiste {item}", "Der Händler will {item}", "{item} für das Dorffest", "Ein Korb voll {item}", "Die Nachbarin braucht {item}", "{item} für das Gasthaus"]
    many: ["Gemüsekorb für das Dorf", "Bestellung vom Wochenmarkt", "Einkauf für das Gasthaus", "Lieferung für die Nachbarn", "Proviant für die Wanderer", "Vorräte für das Dorffest", "Großer Korb für die Mühle"]

buildings:                 # level = ab diesem Level baubar, cost = Taler + Waren
  # action = was man tagsüber am fertigen Gebäude macht (Linksklick im Radius), recipes = Rezepte, das erste machbare wird genommen
  house:                   # Haupthaus mit Küche: Kochen braucht Brennholz
    built: true
    action: { label: Kochen, time: 3.0 }
    recipes:
      - { in: { apple: 2, flour: 1, egg: 1, wood: 1 }, out: { cake: 1 } }
      - { in: { mushroom: 2, baerlauch: 1, wood: 1 }, out: { pan: 1 } }
      - { in: { sorrel: 2, water: 1, wood: 1 }, out: { soup: 1 } }
  well:                    # Brunnen: von Anfang an heil (21.11.2026: Tag 1 braucht volle Feldarbeit für Level 2), Kanne füllen + Wasser ins Fass schöpfen
    built: true
  mill:
    level: 3
    cost: { money: 60, straw: 4, stone: 6 }
    action: { label: Mahlen, time: 3.0 }
    recipes: [{ in: { wheat: 2 }, out: { flour: 1 } }]
  shop:                    # Hofladen (Basti 21.11.2026): ab Level 2, erst nach Tag 2 bezahlbar
    level: 2               # Gefallen aus Aufträgen (20.000 simulierte Starts): Tag 1 = 55-87, Tag 2 = 79-104, Tag 1+2 mind. 134
    cost: { money: 90 }    # knapp über dem Maximum von Tag 1
  juicer:
    level: 3
    cost: { money: 80, wood: 6 }
    action: { label: Entsaften, time: 3.0 }
    recipes:
      - { in: { blue: 8 }, out: { juice: 1 } }
      - { in: { bramble: 8 }, out: { juice: 1 } }
      - { in: { apple: 4 }, out: { juice: 1 } }
  bakery:
    level: 4
    cost: { money: 120, stone: 10, wood: 6 }
    needs: well
    action: { label: Backen, time: 4.0 }
    recipes: [{ in: { flour: 1, water: 1 }, out: { bread: 1 } }]
  carpentry:
    level: 5
    cost: { money: 150, wood: 10 }
  workshop:
    level: 5
    cost: { money: 180, stone: 10 }
  dairy:
    level: 6
    cost: { money: 200, stone: 8 }
    needs: cows
    action: { label: Käse machen, time: 3.0 }
    recipes: [{ in: { milk: 2 }, out: { cheese: 1 } }]
  cows:
    level: 6
    cost: { money: 160, straw: 10, wood: 8 }
  sheep:
    level: 6
    cost: { money: 140, wood: 8 }
  chickens:
    level: 6
    cost: { money: 120, wheat: 6, wood: 4 }
  silo:
    level: 7
    cost: { money: 220, stone: 12 }
    action: { label: Dünger machen, time: 3.0 }
    recipes: [{ in: { green: 3, slurry: 1 }, out: { fert: 2 } }]

camera:                    # Kamera (Basti 21.11.2026: Third Person): PC Maus bewegen dreht (Maus gefangen, Esc = Pause), Handy Wischen rechts
  rotate: 0.006            # rad pro Pixel (Handy-Wischen)
  mouse: 0.55              # PC: x rotate pro Pixel Mausbewegung
  pitch: [0.35, 1.25]      # Neigung (rad über dem Boden), Start 0.97; tief = fast hinter der Figur

# ---------------------------------------------------------------------
# Tutorial-Tag (erster Tag). Texte: die einzige erlaubte Erklärung im Spiel.
loading:                   # Ladebildschirm beim Start: Vorschaubild, Ladebalken, Tipps
  minTime: 2.5             # s, so lange bleibt er mindestens stehen
  tipEvery: 5              # s, dann kommt der nächste Tipp
  fade: 0.6                # s Ausblenden
  tips:                    # zufällige Reihenfolge, Ausnahme von "keine Erklärtexte" (Basti 19.11.2026)
    - Nach dem Säen einmal gießen, dann wächst die Frucht.
    - Jedes Feld hat seine eigene Frucht. Mit jedem Level kommt ein neues Feld dazu.
    - Jeden Morgen kommen drei neue Aufträge. Was abends nicht fertig ist, verfällt. Mit Q klappst du sie ein und aus.
    - Die Gießkanne füllst du am Brunnen auf.
    - Regen gießt alle Felder und den Busch.
    - Hasen sind scheu. Kommst du ihnen zweimal zu nahe, verschwinden sie eine Weile.
    - Tiere kommen nur durch die Lücken im Wald.
    - Ohne Waffe kämpfst du mit der Harke.
    - Blaubeeren als Munition frieren Tiere kurz ein.
    - Unbenutzte Munition kommt abends zurück ins Lager.
    - Jede Ernte bringt XP. Langsame Früchte bringen mehr pro Ernte.
    - Mit jedem Level schaltest du neue Gebäude frei.
    - Weizen erntest du mit der Sichel und bekommst Weizen und Stroh.
    - Abends im Haus nimmst du Aufträge an und gibst sie ab.
    - Fällst du in Ohnmacht, ist der Tag vorbei und die Felder sind wieder trocken.

tutorial:
  raccoonHp: 4             # ein Schlag mit der Handharke vertreibt ihn
  raccoonSteal: 4          # klaut so viele Beeren aus dem Lager
  raccoonSpeed: 3.0        # m/s auf der Flucht (Spieler 4,6)
  raccoonStart: 3          # m neben dem Spieler startet die Flucht nach der Cutscene
  fieldHint: 6             # s bleibt der Hinweis "jeden Tag gießen" stehen
  texts:
    water: Blaubeeren gießen
    waterHere: Gießen
    meanwhile: In der Zwischenzeit das Feld jäten, säen und gießen
    weed: Jäten
    hold: Gedrückt halten, dann geht es von selbst weiter
    sow: Säen
    waterField: Gießen
    daily: Einmal gießen, dann wächst der Weizen.
    almost: Die Blaubeeren sind fast reif
    harvest: Ernten
    hunger: Hunger!
    intruder: Vertreib den Eindringling!
    fight: Kämpfen
    enough: Ganz schön viel für den ersten Tag.


  steal:       { files: [rac_steal_1, rac_steal_2, rac_steal_3], vol: 0.28, pitch: [0.95, 1.1], gap: 0.2 }
  flee:        { files: [rac_flee_1, rac_flee_2, rac_flee_3], vol: 0.3, pitch: [1.0, 1.12], gap: 0.4 }
  attack:      { files: [rac_attack_1, rac_attack_2, rac_attack_3, rac_hiss], vol: 0.26, pitch: [0.95, 1.08], gap: 0.5 }
  fieldAttack: { files: [rac_steal_1, rac_steal_2, rac_steal_3], vol: 0.18, pitch: [0.85, 0.95], gap: 0.7 }
  die:         { files: [rac_die_1, rac_die_2], vol: 0.3, pitch: [0.8, 0.92], gap: 0.15 }
  laugh:       { files: [rac_laugh_1, rac_laugh_2], vol: 0.45, pitch: [1.9, 2.1], gap: 2 }   # rennt mit Beute davon: keckerndes Lachen (doppelt so schnell + höher)

panda:

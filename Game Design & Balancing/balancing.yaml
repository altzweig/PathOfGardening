# =====================================================================
#  PathOfGardening – Balancing (Farming-Gameloop seit 19.11.2026)
# ---------------------------------------------------------------------
#  Single Source of Truth. Das Spiel liest diese Datei bei JEDEM Start.
#  Lokal (npm run dev): Datei speichern -> Spiel lädt automatisch neu.
#  GitHub Pages: Datei committen + pushen -> wird mit ausgeliefert.
#
#  Einheiten: Zeit in Sekunden (s), Distanz in Metern (m), Winkel in Grad,
#  Prozent als Anteil (0.15 = 15 %). Geld = Taler.
#  Die alten Werte (Wellen-Survival) liegen in archiv/garden-defence-v1/design/balancing.yaml.
#  Ablauf und Annahmen: Farming-Gameloop.md, Regeln: Design-Entscheidungen.md.
# =====================================================================

names:
  items:                     # Waren im Lager (Id: Anzeigename)
    blue: Blaubeeren
    wheat: Weizen            # Getreide, zugleich Saatgut
    straw: Stroh
    flour: Mehl
    bread: Brot
    nut: Nüsse
    garlic: Knoblauch
    asp: Spargel
    bean: Bohnen
    leek: Lauch
    carrot: Karotten
    lemon: Zitronen
    apple: Äpfel
    cab: Kohl
    pumpkin: Kürbis
    melon: Melone
    juice: Saft
    milk: Milch
    cheese: Käse
    egg: Eier
    plank: Bretter
    water: Wasser            # im Fass neben dem Brunnen
    green: Grünschnitt       # vom Jäten
    slurry: Gülle            # von den Kühen
    fert: Dünger
    baerlauch: Bärlauch      # Sammeln am Hofrand
    sorrel: Sauerampfer
    mushroom: Pilze
    wood: Brennholz
    stone: Steine
    bramble: Brombeeren      # wilde Brombeersträucher am Hofrand
    soup: Kräutersuppe       # Küche
    pan: Pilzpfanne
    cake: Apfelkuchen
  weapons:
    rake: Harke              # Notwaffe: ohne Waffe oder ohne Munition schlägt man schwertartig mit der Harke
    shotgun: Schrotflinte
    crossbow: Armbrust
    sling: Schleuder
    mace: Streitkolben
    cannon: Kanone
  buildings:
    house: Haupthaus
    well: Brunnen
    shop: Hofladen
    mill: Mühle
    bakery: Bäckerei
    carpentry: Schreinerei
    workshop: Werkstatt
    dairy: Molkerei
    juicer: Saftpresse
    silo: Güllesilo
    chickens: Hühnergehege
    cows: Kuhweide
    sheep: Schafe & Ziegen
    plot: Feld
  animals:
    raccoon: Waschbär
    hare: Hase
  livestock:
    cow: Kuh
    sheep: Schaf
    goat: Ziege
    chicken: Huhn

# ---------------------------------------------------------------------
day:
  length: 300              # s pro Tag (eine Welle = ein Tag, Basti: ca. 5 min)
  clock: [6, 20]           # angezeigte Uhrzeit von Tagesbeginn bis Abend (nur Sonnen-Uhr im HUD)
  light: [2.6, 16.0]       # Lichtstunde (2.6 = heller Morgen .. 16 = Sonnenuntergang) am Anfang und Ende des Tages
  fade: 1.4                # s Schwarzblende am Abend / bei Ohnmacht
  rain:                    # seltener Sommer-Gewitterschauer (gießt alle Felder und den Busch)
    chance: 0.15           # Wahrscheinlichkeit pro Tag (nicht am Tutorial-Tag)
    duration: [20, 32]     # s

player:
  hp: 100
  speed: 4.6               # m/s
  radius: 0.35             # m, Kollision
  reach: 1.7               # m bis zum Ziel, ab hier startet eine Aktion (sonst läuft die Figur erst hin)
  hover: 2.6               # m: Handy-Aktionsknopf nimmt das nächste Ziel in dieser Entfernung
  pickupRadius: 0.9        # m: fallengelassene Beute wird eingesammelt
  magnetRadius: 3          # m: ab hier rollt Beute zum Spieler
  magnetSpeed: 7           # m/s
  hurtStun: 0.25           # s kurzes Zusammenzucken bei einem Biss (bricht die Aktion ab)

# ---------------------------------------------------------------------
# Aktionen tagsüber (außer Kämpfen). Steht man im Radius eines Ziels (player.hover), wird "[Aktionsname]" eingeblendet,
# Linksklick führt sie aus, ein kleiner Zeitbalken läuft voll. time = Dauer in s, label = eingeblendeter Name.
# repeat: läuft von selbst weiter, solange es geht (Busch abernten, Wasser schöpfen ...). Laufen bricht ab.
actions:
  water:       { time: 2.0, label: Gießen }           # Busch / Feld, nur wenn trocken (Feld 1x am Tag)
  plow:        { time: 3.0, label: Pflügen }          # neu angelegtes Feld
  sow:         { time: 2.0, label: Säen }             # gepflügtes Feld, braucht 1 Weizen
  weed:        { time: 1.5, label: Jäten }            # Feld: alles Unkraut raus, je Unkraut 1 Grünschnitt
  fertilize:   { time: 1.5, label: Düngen }           # Feld: 1x am Tag, braucht 1 Dünger
  harvestPlot: { time: 2.0, label: Ernten, repeat: true }   # reifes Feld, mehrmals (plots.cuts), dann abgeerntet
  harvestBush: { time: 1.5, label: Ernten, repeat: true }   # Blaubeerbusch
  refill:      { time: 2.0, label: Kanne füllen }     # Brunnen: Gießkanne auffüllen
  draw:        { time: 1.5, label: Wasser schöpfen, repeat: true }  # Brunnen -> Fass, bis das Fass voll ist
  gather:      { time: 1.0, label: Sammeln }          # Bärlauch, Pilze, Brennholz ... am Hofrand
  weedHof:     { time: 1.0, label: Jäten }            # Unkraut auf dem Hof -> Grünschnitt
  pickWild:    { time: 1.5, label: Pflücken, repeat: true }  # wilder Brombeerstrauch
  shake:       { time: 2.0, label: Schütteln }        # Apfelbaum: reife Äpfel fallen herunter
  feed:        { time: 2.0, label: Füttern }          # Stall: alle Tiere einmal füttern
  straw:       { time: 2.0, label: Stroh auslegen }   # Stall: 1x am Tag, frisches Stroh = mehr Ertrag
  milk:        { time: 3.0, label: Melken }           # Kühe, Schafe, Ziegen
  eggs:        { time: 2.0, label: Eier sammeln }     # Hühner

can:                       # Gießkanne
  capacity: 5              # Füllungen (eine Füllung = einmal gießen)
  start: 5                 # Tutorial-Tag: voll

bush:                      # Blaubeerbusch (jeden Tag): gießen -> reifen -> ernten -> leer
  ripen: 60                # s nach dem Gießen bis erntereif
  bigPicks: 8              # so oft gibt es große Beeren (je actions.harvestBush.time = 1,5 s) ...
  bigBerries: [3, 4]       # ... mit 3-4 Beeren pro Mal: nach ca. 12 s sind 24-32 Beeren im Korb
  smallPicks: 4            # danach nur noch kleine Beeren ...
  smallBerries: 1          # ... je 1 Beere, dann ist der Busch leer
  radius: 0.8              # m Kollision: man steht knapp davor, nicht im Busch
  barDelay: 1              # s nach dem Gießen erscheint der dezente Reife-Balken
  almostAt: 0.75           # Anteil der Reifezeit: Tutorial-Hinweis "fast erntereif"

crops:                     # Feldfrüchte (jetzt nur Weizen): days = gegossene Tage bis reif, yield = Ernte
  wheat:
    seed: wheat            # verbraucht 1x diese Ware beim Säen
    days: 3
    yield: { wheat: 2, straw: 1 }   # pro Ernte-Durchgang (ein reifes Feld wird plots.cuts-mal geerntet)

plots:
  size: 2.6                # m Durchmesser eines Feldes (natürlich wirkendes Sechseck ohne harte Kante)
  cuts: 3                  # so oft kann ein reifes Feld geerntet werden, dann ist es abgeerntet (wieder säen)
  fertBonus: 0.3           # je Düngen (1x pro Tag): 30 % mehr Ernte-Durchgänge
  weeds: { max: 5, every: [35, 70], blockAt: 3 }   # Unkraut pro Feld: wächst alle 35-70 s, Ernten erst bei weniger als 3
  byLevel: [1, 3, 5, 8, 11, 14, 18, 22, 24]   # so viele Felder darf man auf Level 1, 2, 3, ... anlegen
  cost: 20                 # Taler für ein weiteres Feld (Abend: Bauen)

storage:
  capacity: 999            # pro Ware (Lager-Ausbau kommt später)

wild:                      # was auf dem Hof von selbst wächst (nie im Sichtbereich des Spielers)
  weeds: { start: 40, max: 100, every: [6, 12] }      # Unkraut auf dem Hof, wächst rund um die dichten Grasflächen (halb so viel wie vorher)
  forage:                  # Sammeln, am Anfang liegt einiges herum (halb so viel wie vorher)
    start: 20
    max: 35
    every: [6, 12]         # s bis das nächste Ding nachwächst
    band: [0.84, 0.96]     # Waldrand-Streifen (Anteil der Ellipse)
    items: { baerlauch: 3, sorrel: 3, mushroom: 2, wood: 3, stone: 2 }   # Gewichte
    where:                 # wo was wächst: edge = Waldrand, wet = feuchte Wiese hinter dem Brunnen, grass = Rand der dichten Grasflächen
      wood: [edge]
      mushroom: [edge]
      baerlauch: [edge, wet]
      sorrel: [grass]
      stone: [edge]
  brambles: { count: 5, berries: 8, regrow: 15, pick: [1, 2] }   # wilde Brombeeren neben den Waldrand-Büschen: halb so viel pro Zeit wie der Blaubeerbusch
  apples: { perTree: 6, shake: [2, 3] }   # Bäume auf dem Hof: reife Äpfel pro Tag, pro Schütteln fallen so viele herunter
  barrel: 10               # Fass am Brunnen fasst so viel Wasser

grass:                     # wilde Grasgruppen: wachsen nur, wo keiner läuft oder mäht (hinter dem Brunnen, Gebäuderückseiten, geschlossene Zaunseiten, Waldrand, unter Obstbäumen nur niedrig)
  perM2: 24                # Gras-Büschel (je 16 Dreiecke) pro m² bei voller Dichte (Grafik mittel 55 %, niedrig 30 %)
  well: 1                  # Größe der feuchten Wiese hinter dem Brunnen
  back: 1                  # Breite der Streifen an Gebäuderückseiten
  edge: 40                 # Anzahl Gruppen am Waldrand

stalls:                    # Füttern am Stall (Linksklick), nicht einzelne Tiere. Morgens (1. Tageshälfte) und abends (2.) je einmal Ertrag.
  strawBonus: 0.3          # frisches Stroh (1x am Tag): 30 % mehr Ertrag
  strawCost: 1             # Stroh pro Auslegen
  cows:     { animals: [cow, cow], feed: green, feedCost: 2, maxFed: 3, collect: milk, yield: { milk: 2, slurry: 1 } }
  sheep:    { animals: [sheep, goat], feed: green, feedCost: 2, maxFed: 2, collect: milk, yield: { milk: 1 } }
  chickens: { animals: [chicken, chicken, chicken, chicken], feed: wheat, feedCost: 1, maxFed: 1, collect: eggs, yield: { egg: 1 } }
  # yield = pro Tier bei vollem Futter (weniger Futter = anteilig weniger), feedCost = Ware pro Füttern für den ganzen Stall

saves:                     # Spielstände: lokal im Browser (localStorage), mehrere mit Namen, keine Cloud
  autosave: 300            # s Autospeichern während des Spiels (Basti: alle 5 Minuten); zusätzlich bei jedem Tageswechsel
  nameMax: 24              # Zeichen im Spielstandnamen

start:                     # neuer Spielstand
  money: 15
  items: { wheat: 1 }      # 1x Weizen-Saatgut
  plots: 1                 # ein Feld

# ---------------------------------------------------------------------
# Kampf (Rechtsklick). Morgens wählt man genau eine Waffe und eine Munition.
weapons:
  rake:                    # Harke (Notwaffe, immer dabei)
    damage: 4
    range: 1.35            # m
    arc: 110               # Grad Trefferkegel
    cooldown: 0.5          # s
    swing: 0.2             # s Schwung (Treffer in der Mitte)
    knockback: 0.5         # m
    stun: 0.4              # s (Speed linear von 0 auf normal)
  shotgun:
    available: true
    level: 1
    ammo: [blue, wheat, nut, garlic]     # Beeren, Körner, Nüsse, Knoblauch
    ammoPerShot: 1
    cooldown: 0.7
    pellets: 6
    cone: 26               # Grad Streuung
    range: 7               # m
    speed: 20              # m/s Schrot
    damage: 2              # je Schrotkugel (x Munitionsfaktor)
  crossbow:                # vorbereitet, noch gesperrt
    available: false
    level: 4
    ammo: [asp, bean, leek, carrot]
  sling:
    available: false
    level: 3
    ammo: [garlic, nut, lemon, apple]
  mace:
    available: false
    level: 6
    ammo: [cab, pumpkin, melon]
  cannon:
    available: false
    level: 8
    ammo: [cab, pumpkin, melon]

ammo:                      # Wirkung je Munition: damage = Faktor auf den Waffenschaden, freeze = s eingefroren (Blaubeeren)
  blue: { damage: 1, freeze: 2.5 }
  wheat: { damage: 0.6 }
  nut: { damage: 1.4 }
  garlic: { damage: 1.1 }

# ---------------------------------------------------------------------
# Tiere: wenige, kleine Schübe. Sie werden nicht getötet, sondern vertrieben (0 Leben = Flucht in den Wald, XP).
animals:
  raccoon:
    hp: 12
    speed: 2.4             # m/s beim Anschleichen
    fleeSpeed: 3.4         # m/s auf der Flucht (langsamer als der Spieler)
    radius: 0.35
    stealInterval: 0.8     # s pro geklauter Ware
    carryMax: 4            # klaut höchstens so viel, dann flieht er
    shy: 0.35              # Anteil scheuer Waschbären: hauen ab, sobald man näher als `scare` kommt
    scare: 3.5             # m
    aggro: 3               # m: mutige Waschbären greifen den Spieler an, wenn er so nah ist
    damage: 6              # pro Biss
    biteInterval: 1.2      # s
    biteRange: 0.85        # m
    xp: 8
  hare:
    hp: 6
    speed: 2.6
    fleeSpeed: 6.5
    radius: 0.25
    scare: 4.5             # m: flieht immer, sobald der Spieler näher kommt
    eatInterval: 2.5       # s pro gefressener Beere / Feldbiss
    plotBites: 3           # so viele Bisse kosten ein Feld einen Wachstumstag (reifes Feld: 1 Ware je Biss)
    xp: 3

spawns:
  wanderers: [2, 3]        # so viele Tiere kommen zufällig über den Tag verteilt (Hasen)
  wanderTypes: { hare: 1 } # Gewichte
  raid:                    # genau ein Waschbär-Angriff pro Tag, zufällig in der 2. Tageshälfte
    from: 0.5              # Anteil des Tages
    to: 0.88
    raccoons: 1            # auf Level 1 ...
    perLevel: 1            # ... + je weiterem Level ein Waschbär mehr
  scaling:                 # Schwierigkeit steigt mit dem Level: + Anteil je Level über 1
    hp: 0.12
    damage: 0.1
    speed: 0.03

faint:                     # 0 Leben = ohnmächtig: man wacht abends auf, der Rest des Tages ist verloren
  dryFields: true          # alle heute gegossenen Felder sind wieder trocken

# ---------------------------------------------------------------------
levels:
  xp: [0, 30, 80, 150, 250, 380, 550, 760, 1000, 1300]   # XP ab Level 1, 2, 3, ...
  unlocks:                 # was ein Level freischaltet (Gebäude-Ids, zusätzliche Felder kommen über plots.byLevel)
    2: [mill]
    3: [shop, juicer]
    4: [bakery]
    5: [carpentry, workshop]
    6: [dairy, cows, chickens, sheep]
    7: [silo]

quests:
  offers: 2                # neue Angebote pro Abend
  maxActive: 3
  start:                   # Startauftrag, liegt vom ersten Abend an bereit
    need: { blue: 20 }
    reward: { money: 30, xp: 25, items: { wheat: 2 } }
  pool:                    # Zufallsaufträge: need = Ware, Menge [min, max], Taler + XP pro Stück, ab Level
    - { item: blue, amount: [20, 40], money: 1, xp: 1, level: 1 }
    - { item: wheat, amount: [6, 12], money: 3, xp: 3, level: 1 }
    - { item: straw, amount: [4, 8], money: 3, xp: 2, level: 1 }
    - { item: wood, amount: [6, 12], money: 2, xp: 2, level: 1 }
    - { item: mushroom, amount: [4, 8], money: 3, xp: 2, level: 1 }
    - { item: baerlauch, amount: [4, 8], money: 3, xp: 2, level: 1 }
    - { item: green, amount: [10, 20], money: 1, xp: 1, level: 1 }
    - { item: apple, amount: [6, 12], money: 2, xp: 2, level: 1 }
    - { item: pan, amount: [1, 3], money: 14, xp: 10, level: 1 }
    - { item: flour, amount: [3, 6], money: 8, xp: 6, level: 2 }
    - { item: juice, amount: [2, 4], money: 12, xp: 8, level: 3 }
    - { item: bread, amount: [2, 4], money: 18, xp: 12, level: 4 }
    - { item: egg, amount: [4, 8], money: 5, xp: 4, level: 6 }
    - { item: milk, amount: [4, 8], money: 5, xp: 4, level: 6 }
    - { item: cheese, amount: [2, 4], money: 20, xp: 14, level: 6 }

buildings:                 # level = ab diesem Level baubar, cost = Taler + Waren
  # action = was man tagsüber am fertigen Gebäude macht (Linksklick im Radius), recipes = Rezepte, das erste machbare wird genommen
  house:                   # Haupthaus mit Küche: Kochen braucht Brennholz
    built: true
    action: { label: Kochen, time: 3.0 }
    recipes:
      - { in: { apple: 2, flour: 1, egg: 1, wood: 1 }, out: { cake: 1 } }
      - { in: { mushroom: 2, baerlauch: 1, wood: 1 }, out: { pan: 1 } }
      - { in: { sorrel: 2, water: 1, wood: 1 }, out: { soup: 1 } }
  well:                    # Brunnen: kaputt, abends reparieren, dann Kanne füllen und Wasser ins Fass schöpfen
    level: 1
    broken: true
    cost: { money: 40 }
  mill:
    level: 2
    cost: { money: 60, straw: 4, stone: 6 }
    action: { label: Mahlen, time: 3.0 }
    recipes: [{ in: { wheat: 2 }, out: { flour: 1 } }]
  shop:
    level: 3
    cost: { money: 90, wood: 8 }
    questSlots: 1          # mehr Auftragsangebote
  juicer:
    level: 3
    cost: { money: 80, wood: 6 }
    action: { label: Entsaften, time: 3.0 }
    recipes:
      - { in: { blue: 8 }, out: { juice: 1 } }
      - { in: { bramble: 8 }, out: { juice: 1 } }
      - { in: { apple: 4 }, out: { juice: 1 } }
  bakery:
    level: 4
    cost: { money: 120, stone: 10, wood: 6 }
    needs: well
    action: { label: Backen, time: 4.0 }
    recipes: [{ in: { flour: 1, water: 1 }, out: { bread: 1 } }]
  carpentry:
    level: 5
    cost: { money: 150, wood: 10 }
  workshop:
    level: 5
    cost: { money: 180, stone: 10 }
  dairy:
    level: 6
    cost: { money: 200, stone: 8 }
    needs: cows
    action: { label: Käse machen, time: 3.0 }
    recipes: [{ in: { milk: 2 }, out: { cheese: 1 } }]
  cows:
    level: 6
    cost: { money: 160, straw: 10, wood: 8 }
  sheep:
    level: 6
    cost: { money: 140, wood: 8 }
  chickens:
    level: 6
    cost: { money: 120, wheat: 6, wood: 4 }
  silo:
    level: 7
    cost: { money: 220, stone: 12 }
    action: { label: Dünger machen, time: 3.0 }
    recipes: [{ in: { green: 3, slurry: 1 }, out: { fert: 2 } }]

camera:                    # Kamera: mittlere Maustaste (PC) bzw. Wischen rechts (Handy) dreht frei um den Spieler
  rotate: 0.006            # rad pro Pixel
  pitch: [0.55, 1.25]      # Neigung (rad über dem Boden), Start 0.95

# ---------------------------------------------------------------------
# Tutorial-Tag (erster Tag). Texte: die einzige erlaubte Erklärung im Spiel.
loading:                   # Ladebildschirm beim Start: Vorschaubild, Ladebalken, Tipps
  minTime: 2.5             # s, so lange bleibt er mindestens stehen
  tipEvery: 5              # s, dann kommt der nächste Tipp
  fade: 0.6                # s Ausblenden
  tips:                    # zufällige Reihenfolge, Ausnahme von "keine Erklärtexte" (Basti 19.11.2026)
    - Felder brauchen jeden Tag einmal Wasser. Ungegossene Tage zählen nicht.
    - Die Gießkanne füllst du am Brunnen auf.
    - Regen gießt alle Felder und den Busch.
    - Waschbären klauen aus dem Korb am Lager. Triff sie, dann lassen sie die Beute fallen.
    - Hasen sind scheu. Geh auf sie zu, dann flüchten sie in den Wald.
    - Tiere kommen nur durch die Lücken im Wald.
    - Ohne Waffe kämpfst du mit der Harke.
    - Blaubeeren als Munition frieren Tiere kurz ein.
    - Unbenutzte Munition kommt abends zurück ins Lager.
    - XP gibt es für Aufträge und vertriebene Tiere.
    - Mit jedem Level schaltest du neue Gebäude frei.
    - Weizen erntest du mit der Sichel und bekommst Weizen und Stroh.
    - Abends im Haus nimmst du Aufträge an und gibst sie ab.
    - Fällst du in Ohnmacht, ist der Tag vorbei und die Felder sind wieder trocken.

tutorial:
  raccoonHp: 4             # ein Harkenschlag vertreibt ihn
  raccoonSteal: 4          # klaut so viele Beeren aus dem Korb
  raccoonSpeed: 3.0        # m/s auf der Flucht (Spieler 4,6)
  raccoonStart: 3          # m neben dem Spieler startet die Flucht nach der Cutscene
  fieldHint: 6             # s bleibt der Hinweis "jeden Tag gießen" stehen
  texts:
    water: Blaubeeren gießen
    waterHere: Gießen
    meanwhile: In der Zwischenzeit das Feld pflügen, säen und gießen
    rake: Pflügen
    sow: Säen
    waterField: Gießen
    daily: Felder jeden Tag einmal gießen. In 3 Tagen ist der Weizen reif.
    almost: Die Blaubeeren sind fast reif
    harvest: Ernten
    hunger: Hunger!
    intruder: Vertreib den Eindringling!
    fight: Kämpfen
    enough: Ganz schön viel für den ersten Tag.

# ---------------------------------------------------------------------
# Hof-Layout nach Bastis Skizze (19.11.2026). x nach rechts, z nach unten (Bildschirm), Mitte = Hofmitte, 1 Einheit = 1 m.
# rot = Drehung in Grad im Uhrzeigersinn (von oben gesehen). w = Breite (x), d = Tiefe (z).
hof:
  clearing: { rx: 32, rz: 26 }     # Lichtung (Ellipse), außen Wald (ca. 10 m größer als in der Skizze)
  gaps: [-100, -22, 42, 122, 182]  # Waldlücken (rote Pfeile, Grad: 0 = rechts, 90 = unten), nur hier kommen Tiere
  gapWidth: 5
  door: { x: 6.0, z: -6.2 }        # Spieler startet vor der Haustür
  basket: { x: 3.0, z: -6.6 }      # Korb am Lager (neben dem Haus), hier landet die Ernte
  bush: { x: 0.2, z: -5.0 }        # Blaubeerbusch
  buildings:
    house:     { x: 7.4, z: -9.4, w: 8.4, d: 5.2, rot: 18 }
    shop:      { x: 12.9, z: -6.9, w: 3.2, d: 3.6, rot: 18 }
    mill:      { x: 1.4, z: -11.2, w: 3.4, d: 3.4, rot: 20 }
    bakery:    { x: -5.0, z: -10.0, w: 4.2, d: 3.2, rot: -35 }
    well:      { x: -1.6, z: -7.0, r: 0.9 }
    carpentry: { x: -12.6, z: -6.6, w: 4.0, d: 3.4, rot: -20 }
    workshop:  { x: -14.2, z: 6.0, w: 3.6, d: 3.4, rot: 10 }
    juicer:    { x: 17.0, z: 1.8, w: 3.0, d: 3.0, rot: -10 }
    dairy:     { x: -9.0, z: 10.6, w: 3.8, d: 3.0, rot: 25 }
    cows:      { x: -3.6, z: 11.0, w: 5.0, d: 3.6, rot: 0, fence: true }

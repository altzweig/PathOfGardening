# =====================================================================
#  PathOfGardening – Balancing (Farming-Gameloop seit 19.11.2026)
# ---------------------------------------------------------------------
#  Single Source of Truth. Das Spiel liest diese Datei bei JEDEM Start.
#  Lokal (npm run dev): Datei speichern -> Spiel lädt automatisch neu.
#  GitHub Pages: Datei committen + pushen -> wird mit ausgeliefert.
#
#  Einheiten: Zeit in Sekunden (s), Distanz in Metern (m), Winkel in Grad,
#  Prozent als Anteil (0.15 = 15 %). Geld = Taler.
#  Die alten Werte (Wellen-Survival) liegen in archiv/garden-defence-v1/design/balancing.yaml.
#  Ablauf und Annahmen: Farming-Gameloop.md, Regeln: Design-Entscheidungen.md.
# =====================================================================

names:
  items:                     # Waren im Lager (Id: Anzeigename)
    blue: Blaubeeren
    wheat: Weizen            # Getreide, zugleich Saatgut
    straw: Stroh
    flour: Mehl
    bread: Brot
    nut: Nüsse
    garlic: Knoblauch
    asp: Spargel
    bean: Bohnen
    leek: Lauch
    carrot: Karotten
    lemon: Zitronen
    apple: Äpfel
    cab: Kohl
    pumpkin: Kürbis
    melon: Melone
    juice: Saft
    milk: Milch
    cheese: Käse
    egg: Eier
    plank: Bretter
    water: Wasser            # im Fass neben dem Brunnen
    green: Grünschnitt       # vom Jäten
    slurry: Gülle            # von den Kühen
    fert: Dünger
    baerlauch: Bärlauch      # aus den Wildkräutern
    sorrel: Sauerampfer
    mushroom: Pilze
    wood: Brennholz
    stone: Steine
    bramble: Brombeeren      # wilde Brombeersträucher am Hofrand
    soup: Kräutersuppe       # Küche
    pan: Pilzpfanne
    cake: Apfelkuchen
    # Feldfrüchte aus Bastis Fruchttabelle (20.11.2026)
    potato: Kartoffeln
    onion: Zwiebeln
    pea: Erbsen
    celery: Sellerie
    radish: Radieschen
    strawb: Erdbeeren
    lettuce: Kopfsalat
    corn: Mais

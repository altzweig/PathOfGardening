# =====================================================================
#  PathOfGardening – Balancing (Farming-Gameloop seit 19.11.2026)
# ---------------------------------------------------------------------
#  Single Source of Truth. Das Spiel liest diese Datei bei JEDEM Start.
#  Lokal (npm run dev): Datei speichern -> Spiel lädt automatisch neu.
#  GitHub Pages: Datei committen + pushen -> wird mit ausgeliefert.
#
#  Einheiten: Zeit in Sekunden (s), Distanz in Metern (m), Winkel in Grad,
#  Prozent als Anteil (0.15 = 15 %). Geld = Taler.
#  Die alten Werte (Wellen-Survival) liegen in archiv/garden-defence-v1/design/balancing.yaml.
#  Ablauf und Annahmen: Farming-Gameloop.md, Regeln: Design-Entscheidungen.md.
# =====================================================================

names:
  items:                     # Waren im Lager (Id: Anzeigename)
    blue: Blaubeeren
    wheat: Weizen            # Getreide, zugleich Saatgut
    straw: Stroh
    flour: Mehl
    bread: Brot
    nut: Nüsse
    garlic: Knoblauch
    asp: Spargel
    bean: Bohnen
    leek: Lauch
    carrot: Karotten
    lemon: Zitronen
    apple: Äpfel
    cab: Kohl
    pumpkin: Kürbis
    melon: Melone
    juice: Saft
    milk: Milch
    cheese: Käse
    egg: Eier
    plank: Bretter
    water: Wasser            # im Fass neben dem Brunnen
    green: Grünschnitt       # vom Jäten
    slurry: Gülle            # von den Kühen
    fert: Dünger
    baerlauch: Bärlauch      # aus den Wildkräutern
    sorrel: Sauerampfer
    mushroom: Pilze
    wood: Brennholz
    stone: Steine
    bramble: Brombeeren      # wilde Brombeersträucher am Hofrand
    soup: Kräutersuppe       # Küche
    pan: Pilzpfanne
    cake: Apfelkuchen
    # Feldfrüchte aus Bastis Fruchttabelle (20.11.2026)
    potato: Kartoffeln
    onion: Zwiebeln
    pea: Erbsen
    celery: Sellerie
    radish: Radieschen
    strawb: Erdbeeren
    lettuce: Kopfsalat
    corn: Mais
    pepper: Paprika
    tomato: Tomaten
    fence: Zaun              # Zaunstück von der Werkbank (Taste F / Zaun-Knopf stellt es auf)
    zucchini: Zucchini
    eggplant: Auberginen
    chili: Chili
    rhubarb: Rhabarber
    fennel: Fenchel
    dandel: Löwenzahn
    cran: Preiselbeeren
    goose: Stachelbeeren
  weapons:
    rake: Handharke          # kleine einhändige Handharke: Jäten + Notwaffe (Schlag), immer dabei (Id bleibt 'rake')
    shotgun: Schrotflinte
    crossbow: Armbrust
    sling: Schleuder
    mace: Streitkolben
    cannon: Kanone
  buildings:
    house: Haupthaus
    well: Brunnen
    shop: Hofladen
    mill: Mühle
    bakery: Bäckerei
    carpentry: Schreinerei
    workshop: Werkstatt
    dairy: Molkerei
    juicer: Saftpresse
    silo: Güllesilo
    chickens: Hühnergehege
    cows: Kuhweide
    sheep: Schafe & Ziegen
    plot: Feld
  animals:
    raccoon: Waschbär
    hare: Hase
  livestock:
    cow: Kuh
    sheep: Schaf
    goat: Ziege
    chicken: Huhn

# ---------------------------------------------------------------------
day:
  length: 60               # s Tag bis zur Nacht (Basti 22.11.2026: ca. 1 min Frieden, dann 3 min Nacht mit Wellen; vorher 480)
  work: 150                # s Erntearbeit pro Tag für Aufträge und "pro Feld und Tag": 1 min Tag + ca. die Hälfte der Nacht zwischen den Wellen
  clock: [6, 20]           # angezeigte Uhrzeit von Tagesbeginn bis Abend (nur Sonnen-Uhr im HUD)
  light: [2.6, 16.0]       # Lichtstunde (2.6 = heller Morgen .. 16 = Sonnenuntergang) am Anfang und Ende des Tages
  fade: 1.4                # s Schwarzblende am Abend / bei Ohnmacht
  rain:                    # seltener Sommer-Gewitterschauer (gießt alle Felder und den Busch)
    chance: 0.15           # Wahrscheinlichkeit pro Tag (nicht am Tutorial-Tag)
    duration: [20, 32]     # s

player:
  hp: 100
  speed: 4.6               # m/s
  radius: 0.35             # m, Kollision
  reach: 1.7               # m bis zum Ziel, ab hier startet eine Aktion (sonst läuft die Figur erst hin)
  kneel: 0.7               # m: Arbeit am Boden (Jäten, Säen, Ernten am Feld, Sammeln) - so nah kniet man sich an die Stelle, sonst geht man erst hin
  leave: 1.25              # x reach (am Boden x kneel + 0,35 m): entfernt man sich während einer Aktion weiter, bricht sie ab
  actionSpeed: 2.2         # m/s Laufen während einer Aktion im Stehen (Gießen, Füttern ...)
  crouchSpeed: 1.15        # m/s Watscheln in der Hocke (Aktionsknopf gehalten nach Jäten, Säen, Ernten am Boden)
  actionGap: 0.5           # s Pause zwischen zwei automatischen Arbeitsschritten: Figur steht auf (Idle), dann nächster Schritt am SELBEN Feld/Ziel (Basti 22.11.2026: kein Weiterlaufen zum nächsten Feld)
  turnWithCam: 7           # PC: steht die Figur, dreht sie sich mit der Kamera mit (kritisch gedämpfte Feder, kürzester Weg, max. 12 rad/s; höher = straffer, 7 = leicht verzögert)
  hover: 2.6               # m: nur noch für den Bot (läuft zu weiter entfernten Zielen)
  zone: 1.7                # m vom Rand: Interaktionsbereich von Busch, Brunnen, Gebäuden, Bäumen (Basti 22.11.2026). Nur hier drin passiert etwas; immer das nächste Ziel, auch wenn dort gerade nichts zu tun ist, kein automatisches Wechseln
  zoneSmall: 1.0           # m von der Mitte: Interaktionsbereich von Sammelkram und Unkraut im Hof
  pickupRadius: 0.9        # m: fallengelassene Beute wird eingesammelt
  magnetRadius: 3          # m: ab hier rollt Beute zum Spieler
  magnetSpeed: 7           # m/s
  hurtStun: 0.25           # s kurzes Zusammenzucken bei einem Biss (bricht die Aktion ab)

# ---------------------------------------------------------------------
# Aktionen tagsüber (außer Kämpfen). Steht man im Radius eines Ziels (player.hover), wird "[Aktionsname]" eingeblendet,
# Linksklick führt sie aus, ein kleiner Zeitbalken läuft voll. time = Dauer in s, label = eingeblendeter Name.
# repeat: läuft von selbst weiter, solange es geht (Busch abernten, Wasser schöpfen ...).
# Aktionsknopf / linke Maustaste GEHALTEN (21.11.2026): nach jeder Aktion startet die nächste mögliche am anvisierten Ziel,
# gibt es keine, endet die Kette. Laufen während einer Aktion geht (langsamer), zu weit weg (player.leave) bricht ab.
actions:
  water:       { time: 2.0, label: Gießen }           # Busch / Feld: Feld einmal nach dem Säen, dann wächst es
  repair:      { time: 10.0, label: Reparieren }      # zertrampeltes Feld nach der Nacht wieder herrichten (Basti 21.11.2026: 10 s pro Feld)
  sow:         { time: 2.0, label: Säen }             # leeres Feld (auch direkt nach der Ernte, ohne Jäten/Harken), kostet kein Saatgut
  weed:        { time: 1.0, label: Jäten, repeat: true }  # Feld: kniend mit der Handharke, je Durchgang 1 Unkraut -> 1 Grünschnitt
  fertilize:   { time: 1.5, label: Düngen }           # Feld: 1x am Tag, braucht 1 Dünger
  harvestPlot: { time: 1.33, label: Ernten, repeat: true }  # reifes Feld, so oft wie crops.*.cuts, dann abgeerntet
  harvestBush: { time: 1.33, label: Ernten, repeat: true }  # Blaubeerbusch
  refill:      { time: 1.0, label: Kanne füllen, repeat: true }  # Brunnen: je Füllen can.perFill Ladungen, läuft bis die Kanne voll ist (21.11.2026: 1 s statt 2 s)
  draw:        { time: 1.5, label: Wasser schöpfen, repeat: true }  # Brunnen -> Fass, bis das Fass voll ist
  gather:      { time: 1.33, label: Sammeln, repeat: true }  # Pilze, Brennholz, Steine am Hofrand
  weedHof:     { time: 1.0, label: Jäten }            # Wildkräuter auf dem Hof -> Grünschnitt oder Kräuter (wild.herbs)
  pickWild:    { time: 1.33, label: Pflücken, repeat: true }  # wilder Brombeerstrauch
  shake:       { time: 1.33, label: Schütteln, repeat: true } # Obst-/Nussbaum: reife Früchte fallen herunter
  feed:        { time: 2.0, label: Füttern }          # Stall: alle Tiere einmal füttern
  straw:       { time: 2.0, label: Stroh auslegen }   # Stall: 1x am Tag, frisches Stroh = mehr Ertrag
  milk:        { time: 3.0, label: Melken }           # Kühe, Schafe, Ziegen
  eggs:        { time: 2.0, label: Eier sammeln }     # Hühner
  chop:        { time: 1.0, label: Holz hacken }      # Hofbaum (lumber): durchgehend, kein Balken, alle lumber.every s fällt ein Holzstück
  craft:       { time: 1.0, label: Zäune bauen }      # Werkbank: durchgehend, alle lumber.bench.every s ein Zaun (kostet lumber.bench.cost)
  unfence:     { time: 0.6, label: Abbauen }          # aufgestellten Zaun wieder einpacken (kommt zurück ins Lager)

can:                       # Gießkanne (Basti 21.11.2026: 3x füllen = voll)
  capacity: 6              # Ladungen (eine Ladung = einmal gießen), mehr Wasser geht nicht in die Kanne
  perFill: 2               # Ladungen pro Füllen am Brunnen (actions.refill.time)
  start: 6                 # Tutorial-Tag: voll

bush:                      # Blaubeerbusch (mehrjährig, jeden Tag): gießen -> reifen -> ernten -> leer bis morgen
  ripen: 40                # s nach dem Gießen bis erntereif (Fruchttabelle)
  picks: 3                 # Erntevorgänge (je actions.harvestBush.time) ...
  berries: 5               # ... mit so vielen Beeren, dann ist der Busch leer
  radius: 0.8              # m Kollision: man steht knapp davor, nicht im Busch
  barDelay: 1              # s nach dem Gießen erscheint der dezente Reife-Balken
  almostAt: 0.75           # Anteil der Reifezeit: Tutorial-Hinweis "fast erntereif"

# Feldfrüchte (einjährig) aus Bastis Fruchttabelle, 20.11.2026. Zyklus auf jedem Feld:
#   Säen 2 s (kostenlos) -> 1 s sieht man die Pflanze sprießen -> Gießen 2 s -> grow s wachsen -> cuts x Ernten (je 1,33 s)
#   -> 1 s abräumen, dann ist das Feld wieder bereit. Also etwa 10 s + grow pro Durchgang.
# name = Anzeige über dem Feld (nur in der Nähe), level = ab diesem Level säbar, rarity = Seltenheit (Common/Uncommon/Rare), yield = pro Erntevorgang.
crops:                     # Feldfrüchte. ERNTE-EXPERIMENT (Basti 22.11.2026): kein Säen, Gießen, Jäten. Die Pflanze wächst von selbst,
  # dann wird so lange durchgehend geerntet, wie sie zum Wachsen gebraucht hat (harvest, Standard = grow). Alle every s purzelt
  # eine Frucht heraus (yield = pro Frucht; Bruchteile sammeln sich, z. B. Stroh jede 5. Ähre). Danach ist die Pflanze sofort wieder klein.
  # Zeiten = alte Wachstumszeit / 10. every: 0,2 s (Weizen) .. 0,8 s (Kürbis, Melone), nach dem alten Wert pro Stück (logarithmisch).
  # sound = Klanggruppe beim Ernten (sounds.yaml harvest.pop.*): grain, berry, fruit, leaf, root, hard, big
  # Vorher (Stand vor-ernte-experiment): grow 50-440 s, cuts 3, yield pro Erntevorgang.
  wheat:    { name: Weizen, rarity: Common,   grow: 6, every: 0.2, sound: grain, yield: { wheat: 1, straw: 0.2 } }
  carrot:   { name: Karotte, rarity: Common,   grow: 8, every: 0.5, sound: root,  yield: { carrot: 1 } }
  potato:   { name: Kartoffel, rarity: Common,   grow: 10, every: 0.35, sound: root,  yield: { potato: 1 } }
  onion:    { name: Zwiebel, rarity: Common,   grow: 6, every: 0.5, sound: root,  yield: { onion: 1 } }
  garlic:   { name: Knoblauch, rarity: Common,   grow: 5, every: 0.45, sound: root,  yield: { garlic: 1 } }
  pea:      { name: Erbsen, rarity: Common,   grow: 8, every: 0.25, sound: berry, yield: { pea: 1 } }
  celery:   { name: Sellerie, rarity: Common,   grow: 7, every: 0.5, sound: leaf,  yield: { celery: 1 } }
  cab:      { name: Kohl, rarity: Common,   grow: 22, every: 0.7, sound: leaf,  yield: { cab: 1 } }
  radish:   { name: Radieschen, rarity: Uncommon, grow: 8, every: 0.4, sound: root,  yield: { radish: 1 } }
  bean:     { name: Bohnen, rarity: Uncommon, grow: 10, every: 0.35, sound: berry, yield: { bean: 1 } }
  leek:     { name: Lauch, rarity: Uncommon, grow: 9, every: 0.55, sound: hard,  yield: { leek: 1 } }
  strawb:   { name: Erdbeeren, rarity: Uncommon, grow: 7, every: 0.3, sound: berry, yield: { strawb: 1 } }
  lettuce:  { name: Salat, rarity: Uncommon, grow: 7, every: 0.5, sound: leaf,  yield: { lettuce: 1 } }
  corn:     { name: Mais, rarity: Uncommon, grow: 12, every: 0.6, sound: hard,  yield: { corn: 1 } }
  pepper:   { name: Paprika, rarity: Uncommon, grow: 13, every: 0.6, sound: fruit, yield: { pepper: 1 } }
  tomato:   { name: Tomate, rarity: Uncommon, grow: 14, every: 0.6, sound: fruit, yield: { tomato: 1 } }
  zucchini: { name: Zucchini, rarity: Uncommon, grow: 13, every: 0.6, sound: fruit, yield: { zucchini: 1 } }
  eggplant: { name: Aubergine, rarity: Uncommon, grow: 15, every: 0.6, sound: fruit, yield: { eggplant: 1 } }
  asp:      { name: Spargel, rarity: Rare,     grow: 18, every: 0.65, sound: hard,  yield: { asp: 1 } }
  pumpkin:  { name: Kürbis, rarity: Rare,     grow: 40, every: 0.8, sound: big,   yield: { pumpkin: 1 } }
  melon:    { name: Melone, rarity: Rare,     grow: 44, every: 0.8, sound: big,   yield: { melon: 1 } }
  chili:    { name: Chili, rarity: Rare,     grow: 32, every: 0.55, sound: fruit, yield: { chili: 1 } }
  rhubarb:  { name: Rhabarber, rarity: Rare,     grow: 36, every: 0.75, sound: hard,  yield: { rhubarb: 1 } }
  fennel:   { name: Fenchel, rarity: Rare,     grow: 23, every: 0.7, sound: leaf,  yield: { fennel: 1 } }

harvest:                   # Ernte-Experiment (Basti 22.11.2026): durchgehend ernten, Früchte purzeln heraus und werden eingesammelt
  tick: 0.1                # s: so oft wird eingesammelt und verschmolzen (10x pro Sekunde)
  collect: 1.6             # m um die Figur: liegende Früchte in diesem Umkreis werden jeden Tick eingesammelt
  settle: 0.3              # s nach der Landung, erst dann kann eine Frucht eingesammelt werden / verschmelzen
  throw: [0.7, 2.4]        # m/s seitlich: so weit purzeln die Früchte aus der Pflanze (Weizenähren fliegen ein Stück weg)
  up: [2.6, 4.2]           # m/s nach oben
  merge: 3                 # so viele gleiche Früchte gleicher Größe verschmelzen zu einer größeren (3 -> 9 -> 27 ...)
  mergeRadius: 0.7         # m: so nah müssen sie beieinander liegen
  xp: 1.2                  # XP pro Sekunde Ernten (x Seltenheit aus harvestXp.rarity), Bruchteile sammeln sich
  overhead: 0.6            # Aufschlag auf die reine Erntezeit für Einsammeln + Laufwege (Aufträge und Preise rechnen mit every x (1 + overhead))

# XP pro Erntevorgang (Basti 21.11.2026, Formel aus der Fruchttabelle):
#   XP pro Ernte = Seltenheit x (Feldzeit + workWeight x Arbeitszeit) / div, gerundet auf ganze XP pro Vorgang
#   Feldzeit = Wachstum + pause (Feldfrüchte), sonst pauschal pause; Arbeitszeit = Säen + Gießen + Vorgänge x cut
harvestXp:
  pause: 10                # s Laufwege/Handgriffe pro Durchgang
  sow: 2                   # s Säen (nur Feldfrüchte)
  water: 2                 # s Gießen (Feldfrüchte, Blaubeerbusch)
  cut: 1.33                # s pro Erntevorgang
  workWeight: 2            # aktive Arbeit zählt doppelt
  div: 3
  rarity: { Common: 1, Uncommon: 1.3, Rare: 1.6 }
  other:                   # Ernten ohne Feld: Seltenheit und ob gegossen wird (Busch, Bäume, Sträucher, wilde Pflanzen)
    blue:      { rarity: Common, water: true }
    apple:     { rarity: Common }
    nut:       { rarity: Common }
    bramble:   { rarity: Common }
    baerlauch: { rarity: Common }
    dandel:    { rarity: Uncommon }
    sorrel:    { rarity: Uncommon }
    mushroom:  { rarity: Uncommon }

# Mehrjährige Kulturen aus der Tabelle, die noch keinen Platz auf dem Hof haben (kommen später):
#   Preiselbeeren (Uncommon, alle 2 Tage, 3 x 5), Zitronen (Rare, alle 3 Tage, 3 x 1), Stachelbeeren (Rare, alle 2 Tage, 3 x 5)

lumber:                    # Holz hacken + Zäune (Basti 22.11.2026)
  # 3 Hofbäume am Rand der Felder (Lücken im Feldraster des Welt-Editor-Hofs). Hacken wie Ernten: durchgehend, jederzeit abbrechen,
  # das Holz purzelt heraus und wird eingesammelt (harvest.collect). Die Kerbe wird immer tiefer; nach chop s fällt der Baum,
  # der Stamm spaltet sich und dazwischen wächst sapling s lang ein Setzling, dann steht wieder ein Baum.
  trees:
    - { x: 1.5, z: 8.0 }
    - { x: 6.25, z: 5.25 }
    - { x: -3.0, z: 10.5 }
  radius: 0.45             # m Stamm (Kollision)
  chop: 10                 # s hacken bis der Baum fällt
  every: 0.25              # s pro Holzstück -> 40 Holz pro Baum
  yield: { wood: 1 }
  fall: 1.6                # s Umfallen
  sapling: 60              # s Setzling, dann wieder ein Baum
  xp: 0.15                 # XP pro Holzstück
  bench:                   # Werkbank neben den Feldern: Zäune craften (durchgehend, jederzeit)
    x: 0.6
    z: 0.7
    rot: 25
    w: 1.9
    d: 0.9
    every: 1.0             # s pro Zaun
    cost: { wood: 2 }
    out: fence
  fence:                   # Zaun aufstellen: Taste F (Handy: Zaun-Knopf), ein Stück vor der Figur, quer zur Blickrichtung
    length: 1.6            # m pro Zaunstück
    depth: 0.18
    hp: 12                 # Leben eines Zaunstücks
    place: 1.2             # m vor der Figur
    snap: 0.6              # m: Enden in der Nähe rasten an ein vorhandenes Zaunende an
    max: 80                # Zaunstücke auf dem Hof
    detour: 10             # m Umweg: mehr (oder gar kein Weg) = Tiere greifen den Zaun an, sonst laufen sie außen herum
    bite: { raccoon: 2, hare: 1 }   # Schaden pro Biss
    biteEvery: 0.8         # s zwischen zwei Bissen

plots:
  size: 2.6                # m Durchmesser eines Feldes (natürlich wirkendes Sechseck ohne harte Kante)
  zone: 1.9                # m von der Feldmitte: Interaktionsbereich (Basti 22.11.2026, größer als bei anderem, Felder 3 m auseinander -> überlappt etwas). Im Überlapp: erst das aktuelle Feld, wenn es für den nächsten Schritt bereit ist, sonst das andere; ohne aktuelles Feld das mit der näheren Mitte. Im Bereich startet die Aktion sofort, die Figur läuft dabei selbst an die Arbeitsstelle
  # Basti 21.11.2026: Wachstumsbalken, Restzeit und Name der Pflanze nur, wenn man nah dran ist (auch am Blaubeerbusch)
  info: { near: 2.6, far: 3.6, fade: 0.25 }   # m voll sichtbar / m ausgeblendet, s weiches Ein-/Ausblenden
  # Unkraut (Basti 21.11.2026): wächst NUR morgens, nie zwischendurch. Jeden Morgen kommen pro Feld 0/1/2 dazu
  # (morning = Wahrscheinlichkeiten für 0, 1, 2), höchstens max. Jedes Unkraut bremst das Wachstum (slow = bei 1, 2, 3 Unkraut).
  sprout: 0.5              # s nach dem Säen: die Pflanze sprießt sichtbar, erst dann kann man gießen (Basti 22.11.2026: = player.actionGap, das Feld ist bereit, sobald die Figur wieder steht)
  clear: 0.5               # s nach der letzten Ernte, dann ist das Feld wieder bestellbereit (22.11.2026: 0,5 s = player.actionGap)
  fertBonus: 0.3           # je Düngen (1x pro Tag): 30 % mehr Ernte-Durchgänge
  weeds: { max: 3, morning: [0.25, 0.5, 0.25], slow: [0.05, 0.10, 0.15] }
  # Felder kann man nicht kaufen (Basti 21.11.2026): jedes Level-up gibt genau 1 Feld, es wird automatisch platziert.
  # Erstes Level-up: Wahl aus 3 zufälligen Commons, die man noch nicht hat. Danach: 1 zufälliges Common (auch vorhandene).

storage:
  capacity: 999            # pro Ware (Lager-Ausbau kommt später)
  # Lager-Seite im Haus-Buch (Basti 21.11.2026): Bereiche von oben nach unten, je so viele Felder wie Waren.
  # Sortiert wird automatisch: Seltenheit (Common, Uncommon, Rare), dann Erntedauer kurz -> lang (Erzeugnisse: Reihenfolge hier).
  # Waren, die man noch nie hatte, sind ausgegraut mit Schloss. Wasser (Fass) steht nicht im Lager.
  sections:
    - { id: crops, title: Feldfrüchte,    items: [wheat, carrot, potato, onion, garlic, pea, celery, cab, radish, bean, leek, strawb, lettuce, corn, pepper, tomato, zucchini, eggplant, asp, pumpkin, melon, chili, rhubarb, fennel, blue, cran, goose, lemon] }
    - { id: wild,  title: Wilde Pflanzen, items: [apple, nut, bramble, baerlauch, dandel, sorrel, mushroom, wood, stone] }
    - { id: goods, title: Erzeugnisse,    items: [straw, green, flour, bread, juice, milk, cheese, egg, slurry, fert, soup, pan, cake, plank, fence] }
  rarity: { cran: Uncommon, goose: Rare, lemon: Rare }   # Seltenheit von Waren ohne Eintrag in crops / harvestXp.other (sonst Common)
  perennials:              # Mehrjährige aus der Fruchttabelle ohne Platz auf dem Hof (nur Anzeige): alle every Tage reif, picks x pick
    cran:  { every: 2, picks: 3, pick: 5 }
    goose: { every: 2, picks: 3, pick: 5 }
    lemon: { every: 3, picks: 3, pick: 1 }
  history: 60              # Tage Verlauf für den Graphen (Lagerbestand / Ertrag pro Tag)

wild:                      # was auf dem Hof von selbst wächst (nie im Sichtbereich des Spielers)
  weeds: { start: 40, max: 100, every: [6, 12] }      # Wildkräuter-Büschel auf dem Hof, wachsen rund um die dichten Grasflächen
  # Wildkräuter (Basti 21.11.2026): Unkraut, Bärlauch, Löwenzahn und Sauerampfer sind EINE Pflanze (ein Büschel aus kleinen Pflanzen).
  # Jäten = 1 Roll + rolls weitere: Roll 1 gibt zu (1 - pair) 1 Unkraut (= 1 Grünschnitt), zu pair 2 gleiche zufällige Kräuter.
  # Jeder weitere Roll: je chance für jedes Kraut (also 10 % Bärlauch, 10 % Löwenzahn, 10 % Sauerampfer, 70 % nichts). Bis zu 4 Kräuter.
  herbs:
    kinds: [baerlauch, dandel, sorrel]
    pair: 0.1
    rolls: 2
    chance: 0.1
    xpPicks: 3             # XP pro gefundenem Kraut wie früher beim 3x-Sammeln (Bärlauch 2, Löwenzahn/Sauerampfer 3), Unkraut gibt keine XP
  forage:                  # Sammeln, am Anfang liegt einiges herum (halb so viel wie vorher)
    start: 20
    max: 35
    every: [6, 12]         # s bis das nächste Ding nachwächst
    band: [0.84, 0.96]     # Waldrand-Streifen (Anteil der Ellipse)
    items: { wood: 3, stone: 2 }   # Gewichte für Brennholz und Steine (alle every s eins)
    plants:                # wilde Pflanzen (Fruchttabelle): alle spawn s wächst eine nach, picks x Sammeln je picks 1
      mushroom:  { spawn: 70, picks: 3 }   # Bärlauch, Löwenzahn, Sauerampfer stecken seit 21.11.2026 in den Wildkräutern (wild.herbs)
    where:                 # wo was wächst: edge = Waldrand, wet = feuchte Wiese hinter dem Brunnen, grass = Rand der dichten Grasflächen
      wood: [edge]
      mushroom: [edge]
      stone: [edge]
  brambles: { count: 5, every: 2, picks: 3, pick: 5 }   # wilde Brombeeren: alle 2 Tage reif, 3x Pflücken je 5 Beeren
  trees: [apple, apple, nut, apple, apple, apple]   # Bäume auf dem Hof der Reihe nach (Welt-Editor-Reihenfolge), danach wieder von vorn; der 6. ist der große Apfelbaum in der Hofmitte
  apples: { every: 1, picks: 3, shake: 2 }   # Apfelbaum: jeden Tag, 3x Schütteln, je 2 Äpfel fallen herunter
  nuts: { every: 3, picks: 3, shake: 3 }     # Nussbaum: alle 3 Tage, 3x Schütteln, je 3 Nüsse
  barrel: 10               # Fass am Brunnen fasst so viel Wasser

grass:                     # wilde Grasgruppen: wachsen nur, wo keiner läuft oder mäht (hinter dem Brunnen, Gebäuderückseiten, geschlossene Zaunseiten, Waldrand, unter Obstbäumen nur niedrig)
  perM2: 24                # Gras-Büschel (je 16 Dreiecke) pro m² bei voller Dichte (Grafik mittel 55 %, niedrig 30 %)
  well: 1                  # Größe der feuchten Wiese hinter dem Brunnen
  back: 1                  # Breite der Streifen an Gebäuderückseiten
  edge: 40                 # Anzahl Gruppen am Waldrand

texturen:                  # Texturkonzept (20.11.2026): FreeStylized, KTX2. Kachel = Meter pro Texturwiederholung.
  gelaende:                # Boden: Splatmap (r Moos, g Feld, b Pfad, a Pflaster) über Gras, Trockengras per Rauschen
    kachel: { gras: 3.5, moos: 3, feld: 3, pfad: 2.6, trocken: 3.8, pflaster: 2.2 }
    mischschaerfe: 2.5     # Übergänge zwischen den Layern: 1 = sehr weich .. 6 = hart
    rauschen: 0.55         # wie stark die Ränder der Splatmap ausfransen (0 = glatt)
    farbvariation: 0.3     # großflächige Hell/Dunkel- und Farbschwankung (0 = aus)
    normalstaerke: 0.9     # Relief der Normal-Maps (auf Grafik niedrig und am Handy aus)
  gebaeude:                # Gebäude und Felsen: tri-planar, Kachel = Meter pro Wiederholung
    kachel: { holz: 2, holzSchuppen: 1.6, dach: 2.2, stein: 1.8 }
    normalstaerke: 1

nachtlicht:                # Nacht ohne grellen Bloom (Basti 22.11.2026): Laternen beleuchten den Hof statt Leuchten aus jedem Fenster
  bloom: [0.5, 0.86]       # Bloom nachts: Stärke, Schwelle (vorher 1.15 / 0.72; tagsüber bleibt 0.5 / 0.9)
  fenster: 0.55            # Fensterlicht nachts (Glas, Schein, Lichtkegel), 1 = wie vorher
  hauslampe: 6             # echtes Licht der Laterne an der Haustür (vorher 22, blendete die Hauswand)
laternen:                  # altmodische Laternen: 3 am Hofbaum, weitere an den Hofeingängen (im Welt-Editor als "Laterne" unter Hof platzierbar)
  baum:
    anzahl: 3              # je 120° um den Stamm, die erste zeigt zur Hofmitte
    radius: [0.9, 2.6]     # m vom Stamm, in dem ein Ast zum Einhängen gesucht wird
    hoehen: [1.75, 1.9, 1.6]   # m Unterkante jeder Laterne über dem Boden (leicht unterschiedlich; Apfelbaum ist halb so hoch wie der alte Baum)
    drehung: 0             # Grad, dreht alle drei um den Stamm
    punkt: null            # [x, z] wenn ein anderer Baum gemeint ist (sonst der Baum, der der Hofmitte am nächsten steht)
  glas: 2.2                # Leuchtkraft des Glases
  halo: [1.1, 0.45]        # weicher Schein um die Laterne: Größe m, Stärke
  boden: [2.2, 0.32]       # warmer Lichtfleck am Boden: Radius m, Stärke
  licht: [9, 9]            # das eine echte Licht unter dem Hofbaum: Stärke, Reichweite m (die Eingangslaternen leuchten nur gefaked)
  pendeln: 0.05            # rad, leichtes Schaukeln der hängenden Laternen
stalls:                    # Füttern am Stall (Linksklick), nicht einzelne Tiere. Morgens (1. Tageshälfte) und abends (2.) je einmal Ertrag.
  strawBonus: 0.3          # frisches Stroh (1x am Tag): 30 % mehr Ertrag
  strawCost: 1             # Stroh pro Auslegen
  cows:     { animals: [cow, cow], feed: green, feedCost: 2, maxFed: 3, collect: milk, yield: { milk: 2, slurry: 1 } }
  sheep:    { animals: [sheep, goat], feed: green, feedCost: 2, maxFed: 2, collect: milk, yield: { milk: 1 } }
  chickens: { animals: [chicken, chicken, chicken, chicken], feed: wheat, feedCost: 1, maxFed: 1, collect: eggs, yield: { egg: 1 } }
  # yield = pro Tier bei vollem Futter (weniger Futter = anteilig weniger), feedCost = Ware pro Füttern für den ganzen Stall

saves:                     # Spielstände: lokal im Browser (localStorage), mehrere mit Namen, keine Cloud
  autosave: 300            # s Autospeichern während des Spiels (Basti: alle 5 Minuten); zusätzlich bei jedem Tageswechsel
  nameMax: 24              # Zeichen im Spielstandnamen

start:                     # neuer Spielstand
  money: 0                 # Gefallen
  items: { blue: 20, bramble: 10 }   # (22.11.2026) ein paar Beeren für die Schrotflinte zum Start
  plots: 3                 # offene Felder zu Beginn (Basti 22.11.2026: Felder haben keine feste Frucht mehr), dazu der Blaubeerbusch

seeds:                     # Saatgut (Basti 22.11.2026): unendlich. Seit dem Aussaatplan (22.11.2026) hat jedes Feld eine feste Frucht, abends im Haus-Buch geplant (Tab schaltet jetzt die Munition)
  start: [wheat, cab, onion]   # Saatgut zu Beginn
  offer: 3                 # nach jedem Level-up: so viele neue Sorten zur Wahl (erst alle Commons, dann Uncommons, dann Rares)

# ---------------------------------------------------------------------
# Kampf (Rechtsklick). Morgens wählt man genau eine Waffe und eine Munition.
weapons:
  rake:                    # Handharke (einhändig, immer dabei): Schlag mit Rechtsklick / Angriffsknopf
    damage: 4
    range: 1.35            # m
    arc: 120               # Grad Trefferkegel (Basti 21.11.2026)
    cooldown: 0.5          # s
    swing: 0.2             # s Schwung (Treffer in der Mitte)
    knockback: 0.5         # m
    stun: 0.4              # s (Speed linear von 0 auf normal)
  shotgun:                 # BEEREN-SCHROTFLINTE (Basti 22.11.2026): von Anfang an dabei, schießt die gewählte Beere direkt aus dem Lager (Tab / Munitionsknopf)
    available: true
    level: 1
    ammo: [blue, strawb, bramble]   # Blaubeeren (frieren ein), Erdbeeren (bluten), Brombeeren (Doom)
    ammoPerShot: 1         # Beeren aus dem Lager pro Schuss (ein Schuss = 3 Beeren-Kugeln)
    cooldown: 0.6
    pellets: 3             # 3 Beeren nah beieinander ...
    cone: 10               # ... ca. 10 Grad Streuung ...
    stagger: 0.04          # ... leicht versetzt (s Abstand zwischen den Beeren)
    range: 20              # m, dann platzen sie
    speed: 26              # m/s
    damage: 2              # je Beere (x Munitionsfaktor)
  crossbow:                # vorbereitet, noch gesperrt
    available: false
    level: 4
    ammo: [asp, bean, leek, carrot]
  sling:
    available: false
    level: 3
    ammo: [garlic, nut, lemon, apple]
  mace:
    available: false
    level: 6
    ammo: [cab, pumpkin, melon]
  cannon:
    available: false
    level: 8
    ammo: [cab, pumpkin, melon]

ammo:                      # Wirkung je Beere: damage = Faktor auf den Waffenschaden, freeze = s eingefroren, bleed = blutet (siehe bleed), doom = HP auf den Doom-Balken pro Treffer
  blue:    { damage: 1, freeze: 2.5 }      # Blaubeeren: frieren ein
  strawb:  { damage: 0.8, bleed: 1 }       # Erdbeeren: Gegner blutet
  bramble: { damage: 0.6, doom: 1.5 }      # Brombeeren: Doom. Dunkellila Balken vorne in der Lebensleiste, fällt das Leben auf diesen Bereich, ist der Gegner sofort vertrieben
  wheat: { damage: 0.6 }
  nut: { damage: 1.4 }
  garlic: { damage: 1.1 }
bleed: { dps: 1, time: 4 }   # Bluten (Erdbeeren): Leben pro s, so viele s nach dem letzten Treffer

# ---------------------------------------------------------------------
# Tiere: wenige, kleine Schübe. Sie werden nicht getötet, sondern vertrieben (0 Leben = Flucht in den Wald, XP).
animals:
  raccoon:
    hp: 12
    speed: 2.4             # m/s beim Anschleichen
    fleeSpeed: 3.4         # m/s auf der Flucht (langsamer als der Spieler)
    radius: 0.35
    stealInterval: 0.8     # s pro geklauter Ware
    carryMax: 4            # klaut höchstens so viel, dann flieht er
    shy: 0.35              # Anteil scheuer Waschbären: hauen ab, sobald man näher als `scare` kommt
    scare: 3.5             # m
    aggro: 3               # m: mutige Waschbären greifen den Spieler an, wenn er so nah ist
    damage: 6              # pro Biss
    biteInterval: 1.2      # s
    biteRange: 0.85        # m
    xp: 8
  hare:
    hp: 6
    speed: 2.6
    fleeSpeed: 6.5
    radius: 0.25
    scare: 4.5             # m: so nah darf man kommen (Basti 21.11.2026: Hasen stehlen nichts, sie hoppeln nur nahe den Feldern herum)
    run: 15                # m: beim ersten Erschrecken laufen sie so weit weg ...
    away: 60               # s: ... beim zweiten verlassen sie den Hof und kommen nach so vielen Sekunden wieder
    eatInterval: 2.5       # (nicht mehr benutzt)
    plotBites: 3           # (nicht mehr benutzt)
    xp: 3

spawns:
  wanderers: [1, 2]        # so viele Hasen hoppeln ab dem Morgen nahe den Feldern herum
  wanderTypes: { hare: 1 } # Gewichte
  raid:                    # genau ein Waschbär-Angriff pro Tag, zufällig in der 2. Tageshälfte
    from: 0.5              # Anteil des Tages
    to: 0.88
    raccoons: 0            # 21.11.2026: vorerst keine Waschbären (kommen später mit höherem Level) ...
    perLevel: 0            # ... + je weiterem Level so viele mehr
  scaling:                 # Schwierigkeit steigt mit dem Level: + Anteil je Level über 1
    hp: 0.12
    damage: 0.1
    speed: 0.03

faint:                     # 0 Leben = ohnmächtig (Basti 21.11.2026): Cutscene, man wacht abends auf, der schlimmste Fall tritt ein
  loseHarvest: true        # die gesamte Ernte des Tages ist weg (auch was Tiere tragen oder am Boden liegt)
  breakFields: true        # alle Felder sind zertrampelt und müssen repariert werden

night:                     # Nachtangriff nach jedem Tag (Basti 21.11.2026): statt ins Haus beginnt ein Countdown, Tiere greifen den Hof an
  length: 180              # s Countdown der Nacht (Basti 22.11.2026: 3 min Kampf), danach geht es ins Haus (Abend-UI)
  dusk: 8                  # s vom Sonnenuntergang bis zur dunklen Nacht (Licht)
  warn: 5.5                # s steht die Warnung "Die Nacht bricht herein" (mit Soundeffekt)
  light: [16.0, 20.6]      # Lichtstunde bei Einbruch der Nacht / ab `dusk` (20.6 = Mondlicht)
  flee: 4                  # s vor Ende der Nacht hauen alle Tiere ab
  crops: true              # Felder wachsen nachts weiter (zwischen den Wellen ernten), Basti 22.11.2026
  calm: 6                  # s nach Einbruch der Nacht, bevor überhaupt etwas kommt (Warnung)
  # Pacing (Basti 22.11.2026, Skizze): 1 min Frieden (Tag), dann 3 min Kampf in 3-5 Wellen. Jede Welle schwillt an und ab
  # und ist stärker als die vorige, dazwischen nur einzelne Tiere. Stärker mit dem Level (Koop: Durchschnittslevel aller Spieler).
  waves:
    count: [3, 5]          # Wellen pro Nacht: 3 auf Level 1, höchstens 5 ...
    countEvery: 4          # ... +1 Welle alle 4 Level (Level 5: 4 Wellen, Level 9: 5)
    first: 4               # Tiere in der 1. Welle auf Level 1
    grow: 0.8              # jede weitere Welle + so viel x die erste (Welle 2 = x1,8, Welle 3 = x2,6, Welle 4 = x3,4 ...)
    perLevel: 0.1          # + Anteil Tiere in jeder Welle je Level über 1 (Level 5 = x1,4, Level 9 = x1,8)
    raccoon: 0.4           # Anteil Waschbären in einer Welle, der Rest sind Hasen
    end: 12                # s vor Ende der Nacht ist die letzte Welle durch (dann hauen alle ab, siehe flee)
    gap: 12                # s Ruhe zwischen zwei Wellen (nur Einzelgänger)
    width: [1, 1.6]        # Gewicht der Wellendauer: erste Welle .. letzte (spätere Wellen dauern länger), zusammen füllen sie die Nacht
  trickle:                 # zwischen den Wellen: einzelne Tiere
    every: [7, 12]         # s zwischen zwei Einzelgängern (Koop: halb so lang)
    raccoon: 0.3           # Wahrscheinlichkeit Waschbär, sonst Hase
  hare:                    # aggressiver Hase (rote Augen): frisst Felder an, haut erst ab, wenn sein Leben weg ist
    hp: 8                  # Handharke macht 4 Schaden: 2 Treffer (+ Level-Skalierung spawns.scaling)
    speed: 3.0             # m/s
    biteInterval: 1.2      # s pro Biss ins Feld
    plotDamage: 1          # Feld-Lebenspunkte pro Biss
    xp: 4
  raccoon:                 # Waschbär (funkelnde blaue Augen): greift den Spieler an und klaut bei jedem Treffer Ernte aus der Tasche
    hp: 16                 # 4 Treffer mit der Handharke
    speed: 2.9             # m/s (Spieler läuft 4,6)
    damage: 8              # pro Biss
    biteInterval: 1.3      # s
    steal: 0.12            # jeder Biss klaut diesen Anteil der heutigen Ernte (mind. 1 Stück)
    bites: 3               # nach so vielen Treffern haut er mit der Beute ab (Treffer auf ihn: er lässt alles fallen)
    xp: 10
  plotHp: 12               # Lebenspunkte eines Feldes in der Nacht; bei 0 zertrampelt (Pflanzen kaputt, 10 s reparieren)
  brokenShow: 0.06         # so weit ist der rote Balken eines zertrampelten Feldes gefüllt

# ---------------------------------------------------------------------
coop:                      # Koop-Besuche (Basti 22.11.2026): Gäste helfen auf dem Hof, Ertrag an den Hof, XP an den, der arbeitet
  maxPlayers: 4              # Host + bis zu 3 Gäste
  koTime: 20                 # s k.o., dann steht man am Haus wieder auf (schlimmster Fall + Cutscene nur, wenn alle gleichzeitig k.o. sind)
  hostShare: 0.25            # Anteil der Gast-XP, den der Hofbesitzer zusätzlich bekommt (Hofbonus)
  nightFactor: 2             # Koop (Basti 22.11.2026): doppelt so viele Tiere in der Nacht (Wellen + Einzelgänger), Tier-HP bleiben gleich
  # Kurznachrichten unter Freunden (Basti 22.11.2026: nur feste Sätze, kein freier Text). Gespeichert wird nur die Nummer
  # (0-31): neue Sätze hinten anhängen, bestehende nicht umsortieren. Höchstens 32.
  messages:
    - Hallo!
    - Komm vorbei!
    - Mein Hof ist offen
    - Darf ich vorbeikommen?
    - Bin gleich da
    - Jetzt nicht
    - Danke für die Hilfe!
    - Gute Ernte!
    - Heute Nacht wird's wild
    - Bis später!

levels:
  # Basti 21.11.2026: grob alle 2-3 Tage ein Level, Level 2 schon an Tag 1. Ernte-XP pro Tag wachsen mit den Feldern
  # (je Feld realistisch ca. 125 XP/Tag, Level L hat L+2 Felder), daher Abstand ca. 2,5 Tage x 125 x (L+2).
  xp: [0, 250, 1500, 3050, 4950, 7100, 9600, 12400, 15500, 19000]   # XP ab Level 1, 2, 3, ...
  unlocks:                 # was ein Level freischaltet (Gebäude-Ids; dazu gibt jedes Level-up 1 Feld + neues Saatgut zur Wahl)
    3: [mill, juicer]
    4: [bakery]
    5: [carpentry, workshop]
    6: [dairy, cows, chickens, sheep]
    7: [silo, shop]

quests:                    # Tagesaufträge (Basti 21.11.2026): morgens automatisch angenommen, abends verfallen die offenen
  daily:
    slots: { start: 2, first: 5, every: 5, max: 9 }   # Aufträge pro Tag (Basti 22.11.2026): 2 am Anfang, +1 auf Level 5, 10, 15, ... 35
    load: 0.45             # Ernte-Experiment: Anteil des Tages (Taglänge), den alle Aufträge zusammen an Ernte-Arbeit belegen (Stück x every x (1 + harvest.overhead)); vorher 0,55 der Feld-Sekunden
    cycle: 10              # nicht mehr benutzt (Ernte-Experiment: Aufträge rechnen mit harvest.overhead)
    objectives: [1, 1, 2, 2, 2, 3]   # höchstens so viele Ziele pro Auftrag auf Level 1, 2, 3, ...
    blue: { max: 10, min: 5, sec: 2 }  # (Ernte-Experiment: vorher sec 8) Blaubeeren (Busch gibt 15, der Waschbär klaut bis zu 4): höchstens so viele pro Tag, kleinstes Ziel, zählen wie s Feldarbeit pro Beere
    wild:                  # Wildauftrag (Basti 22.11.2026): Kräuter aus den Wildkräuter-Büscheln jäten
      level: 2             # ab diesem Level
      chance: 0.5          # Chance pro Tag, dass einer der Aufträge ein Wildauftrag ist
      kinds: [1, 2]        # so viele verschiedene Kräuter
      n: [2, 3]            # Stück je Kraut (ein Büschel gibt im Schnitt ca. 0,27 je Kraut)
      sec: 6               # (Ernte-Experiment: vorher 22) s Arbeit pro Kraut (Suchen + Jäten), daraus Belohnung wie bei den anderen Aufträgen
      titles: ["Kräuter für die Apotheke", "Wildkräuter für die Suppe", "Die Kräuterfrau bittet", "Salat von der Wiese", "Kräuter für das Gasthaus"]
    daysPerLevel: 2.5      # Tage pro Level ...
    xpShare: 0.1           # ... davon kommt dieser Anteil der XP aus Aufträgen (der Rest aus Ernten)
    money: 0.45            # Taler pro Sekunde Ernte-Arbeit (Ernte-Experiment, vorher 0,12 pro Feld-Sekunde) ...
    moneyLevel: 0.15       # ... plus so viel Anteil je Level über 1
    minMoney: 15           # mindestens so viele Taler pro Auftrag (Tag 1 ohne Brunnen: kleine Aufträge, trotzdem reicht es abends für die Reparatur)
  titles:                  # 3-5 Wörter; {item} = Name der Ware
    one: ["{item} für den Markt", "Eine Kiste {item}", "Der Händler will {item}", "{item} für das Dorffest", "Ein Korb voll {item}", "Die Nachbarin braucht {item}", "{item} für das Gasthaus"]
    many: ["Gemüsekorb für das Dorf", "Bestellung vom Wochenmarkt", "Einkauf für das Gasthaus", "Lieferung für die Nachbarn", "Proviant für die Wanderer", "Vorräte für das Dorffest", "Großer Korb für die Mühle"]

shop:                      # Hofladen im Haus-Buch (Basti 22.11.2026): Waren per Drag & Drop in die Verkaufs-Slots, verkauft wird über den Tag (abgerechnet abends)
  slots: { level: 7, start: 2, first: 12, every: 5, max: 9 }   # ab Level 7 2 Slots, +1 auf Level 12, 17, 22, ...
  rate: 0.3                # Normalpreis pro Stück = Ernte-Sekunden pro Stück x rate (Ernte-Experiment; Aufträge zahlen 0.45 pro Sekunde)
  craft: 1.25              # Erzeugnisse aus Rezepten: Wert der Zutaten x craft
  demand: 6                # Nachfrage pro Slot und Tag: Waren im Wert von so vielen Gefallen (zum Normalpreis)
  spread: 0.3              # Nachfrage schwankt jeden Tag um ± diesen Anteil
  sale:    { price: 0.7, demand: 1.6 }   # Sale: -30 % Preis, es wird mehr verkauft
  premium: { price: 1.3, demand: 0.5 }   # Premium: +30 % Preis, es wird weniger verkauft
  base: 0.2                # Preis pro Stück für Waren ohne Feld, Rezept oder Eintrag unten
  prices:                  # Preis pro Stück (Gefallen) für Waren ohne Feld oder Rezept
    apple: 0.3
    nut: 0.3
    bramble: 0.1
    baerlauch: 0.4
    dandel: 0.4
    sorrel: 0.4
    mushroom: 0.5
    wood: 0.2
    stone: 0.2
    straw: 0.1
    green: 0.05
    slurry: 0.05
    fert: 0.3
    milk: 0.6
    egg: 0.5
    cran: 0.3
    goose: 0.5
    lemon: 1.5

buildings:                 # level = ab diesem Level baubar, cost = Taler + Waren
  # action = was man tagsüber am fertigen Gebäude macht (Linksklick im Radius), recipes = Rezepte, das erste machbare wird genommen
  house:                   # Haupthaus mit Küche: Kochen braucht Brennholz
    built: true
    action: { label: Kochen, time: 3.0 }
    recipes:
      - { in: { apple: 2, flour: 1, egg: 1, wood: 1 }, out: { cake: 1 } }
      - { in: { mushroom: 2, baerlauch: 1, wood: 1 }, out: { pan: 1 } }
      - { in: { sorrel: 2, water: 1, wood: 1 }, out: { soup: 1 } }
  well:                    # Brunnen: von Anfang an heil (21.11.2026: Tag 1 braucht volle Feldarbeit für Level 2), Kanne füllen + Wasser ins Fass schöpfen
    built: true
  mill:
    level: 3
    cost: { money: 60, straw: 4, stone: 6 }
    action: { label: Mahlen, time: 3.0 }
    recipes: [{ in: { wheat: 2 }, out: { flour: 1 } }]
  shop:                    # Hofladen: ab Level 7 (Basti 22.11.2026, vorher Level 2)
    level: 7
    cost: { money: 90 }
  juicer:
    level: 3
    cost: { money: 80, wood: 6 }
    action: { label: Entsaften, time: 3.0 }
    recipes:
      - { in: { blue: 8 }, out: { juice: 1 } }
      - { in: { bramble: 8 }, out: { juice: 1 } }
      - { in: { apple: 4 }, out: { juice: 1 } }
  bakery:
    level: 4
    cost: { money: 120, stone: 10, wood: 6 }
    needs: well
    action: { label: Backen, time: 4.0 }
    recipes: [{ in: { flour: 1, water: 1 }, out: { bread: 1 } }]
  carpentry:
    level: 5
    cost: { money: 150, wood: 10 }
  workshop:
    level: 5
    cost: { money: 180, stone: 10 }
  dairy:
    level: 6
    cost: { money: 200, stone: 8 }
    needs: cows
    action: { label: Käse machen, time: 3.0 }
    recipes: [{ in: { milk: 2 }, out: { cheese: 1 } }]
  cows:
    level: 6
    cost: { money: 160, straw: 10, wood: 8 }
  sheep:
    level: 6
    cost: { money: 140, wood: 8 }
  chickens:
    level: 6
    cost: { money: 120, wheat: 6, wood: 4 }
  silo:
    level: 7
    cost: { money: 220, stone: 12 }
    action: { label: Dünger machen, time: 3.0 }
    recipes: [{ in: { green: 3, slurry: 1 }, out: { fert: 2 } }]

camera:                    # Kamera (Basti 21.11.2026: Third Person): PC Maus bewegen dreht (Maus gefangen, Esc = Pause), Handy Wischen rechts
  rotate: 0.006            # rad pro Pixel (PC-Maus x mouse)
  mouse: 0.55              # PC: x rotate pro Pixel Mausbewegung
  follow: 2.4              # Handy (Basti 22.11.2026): Kamera schaut immer in Laufrichtung, schwenkt mit dieser Geschwindigkeit (1/s) hinter die Figur (auch Top-Down dreht mit); kein Drehen per Wischen mehr, Zwei-Finger-Pinch = Zoom
  occlusion: { inner: 1.2, outer: 2.8, pc: 1.5, mobile: 2 }   # Durchsicht durch Bäume/Dächer/Zäune: Radius in m auf Höhe der Figur (innen ganz weg, außen unberührt), x pc / x mobile (Basti 22.11.2026: PC 50 % größer, Handy doppelt so groß)
  pitch: [0.1, 1.3]        # Neigung (rad über dem Boden), Start 0.55; tief = fast hinter der Figur (First Person: hoch/runter schauen)
  zoom: { near: 3, far: 10, top: 10, topMax: 15, push: 300, back: 100 }   # Basti 22.11.2026: Third Person 3-10 m (Start 3); über 10 m gegen den Widerstand = Top-Down, dort weiter rauszoomen 10-15 m Höhe; push/back = Mausrad-Einheiten gegen den Widerstand (raus / wieder rein, 1 Rasterschritt ~ 100). First Person gibt es nicht mehr.

# ---------------------------------------------------------------------
# Tutorial-Tag (erster Tag). Texte: die einzige erlaubte Erklärung im Spiel.
loading:                   # Ladebildschirm beim Start: Vorschaubild, Ladebalken, Tipps
  minTime: 2.5             # s, so lange bleibt er mindestens stehen
  tipEvery: 5              # s, dann kommt der nächste Tipp
  fade: 0.6                # s Ausblenden
  tips:                    # zufällige Reihenfolge, Ausnahme von "keine Erklärtexte" (Basti 19.11.2026)
    - Nach dem Säen einmal gießen, dann wächst die Frucht.
    - Jedes Feld hat seine eigene Frucht. Mit jedem Level kommt ein neues Feld dazu.
    - Jeden Morgen kommen drei neue Aufträge. Was abends nicht fertig ist, verfällt. Mit Q klappst du sie ein und aus.
    - Die Gießkanne füllst du am Brunnen auf.
    - Regen gießt alle Felder und den Busch.
    - Hasen sind scheu. Kommst du ihnen zweimal zu nahe, verschwinden sie eine Weile.
    - Tiere kommen nur durch die Lücken im Wald.
    - Ohne Waffe kämpfst du mit der Harke.
    - Blaubeeren als Munition frieren Tiere kurz ein.
    - Unbenutzte Munition kommt abends zurück ins Lager.
    - Jede Ernte bringt XP. Langsame Früchte bringen mehr pro Ernte.
    - Mit jedem Level schaltest du neue Gebäude frei.
    - Weizen erntest du mit der Sichel und bekommst Weizen und Stroh.
    - Abends im Haus nimmst du Aufträge an und gibst sie ab.
    - Fällst du in Ohnmacht, ist der Tag vorbei und die Felder sind wieder trocken.

tutorial:
  raccoonHp: 4             # ein Schlag mit der Handharke vertreibt ihn
  raccoonSteal: 4          # klaut so viele Beeren aus dem Lager
  raccoonSpeed: 3.0        # m/s auf der Flucht (Spieler 4,6)
  raccoonStart: 3          # m neben dem Spieler startet die Flucht nach der Cutscene
  fieldHint: 6             # s bleibt der Hinweis "jeden Tag gießen" stehen
  texts:
    water: Blaubeeren gießen
    waterHere: Gießen
    meanwhile: In der Zwischenzeit das Feld jäten, säen und gießen
    weed: Jäten
    hold: Gedrückt halten, dann geht es von selbst weiter
    sow: Säen
    waterField: Gießen
    daily: Die Pflanzen wachsen von selbst nach.
    field: Weizen ernten
    collect: Einsammeln
    almost: Die Blaubeeren sind fast reif
    harvest: Ernten
    hunger: Hunger!
    intruder: Vertreib den Eindringling!
    fight: Kämpfen
    enough: Ganz schön viel für den ersten Tag.


  attack:      { files: [toad_tongue_1, toad_tongue_2, toad_tongue_3], vol: 0.12, pitch: [0.9, 1.15], gap: 0.2, synth: tongue }
  fieldAttack: { files: [toad_tongue_1, toad_tongue_2, toad_tongue_3], vol: 0.08, pitch: [0.85, 1.0], gap: 0.4, synth: tongue }
  die:         { files: [toad_die_1, toad_die_2, toad_die_3], vol: 0.15, pitch: [0.75, 0.9], gap: 0.1 }

sheep:
  wave:        { files: [sheep_baa_1, sheep_baa_2, sheep_baa_3], vol: 0.25, pitch: [0.95, 1.1], gap: 0.6 }
  charge:      { files: [sheep_baa_1, sheep_baa_2, sheep_baa_3], vol: 0.35, pitch: [1.1, 1.3], gap: 0.2 }   # holt Anlauf

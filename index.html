<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>PathOfGardening</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hurt"></div>

  <!-- one day on the farm -->
  <div id="fHud" hidden>
    <div id="fTop">
      <div id="fLeft">
        <div class="fBar hp"><i id="fHpIc"></i><div class="track"><div id="fHpFill"></div></div></div>
        <div class="fBar xp"><i class="lvl"><b id="fLvlN">1</b></i><div class="track"><div id="fXpFill"></div></div></div>
      </div>
      <div id="fClock"><svg viewBox="0 0 100 52"><path d="M12 44 A38 34 0 0 1 88 44" fill="none" stroke="#e3b96455" stroke-width="3" stroke-dasharray="4 5"/><path d="M4 44 H96" stroke="#e3b96488" stroke-width="2"/><circle id="fSun" cx="12" cy="44" r="7" fill="#ffd040" stroke="#7a4a10" stroke-width="1.5"/></svg><b id="fDay">1</b></div>
      <div id="fRight">
        <div class="chipf"><i id="fCoinIc"></i><b id="fMoney">0</b></div>
        <div id="fWater"></div>
        <div id="fWeap"></div>
        <button class="ibtn" id="fPause" aria-label="Pause"></button>
      </div>
    </div>
    <div id="fHint" hidden></div>
    <div id="fFight" hidden></div>
    <div id="fCursor" hidden></div>
    <div id="fFloat"></div>
    <div id="fStick" hidden><div class="knob"></div></div>
    <div id="fBtns">
      <button id="bAtk" aria-label="Kämpfen"></button>
      <button id="bAct" aria-label="Arbeiten"></button>
    </div>
  </div>
  <div id="fBars"><i></i><i></i></div>
  <div id="fFade"></div>

  <!-- evening in the house -->
  <div class="fo" id="fHouse" hidden>
    <div class="panel">
      <header><div class="ttl"><span class="moonI"></span><b>Abend</b><small>Tag <span id="hDay">1</span></small></div><div class="stat" id="hLvl"></div><div class="stat" id="hMoney"></div></header>
      <div id="hTop"></div>
      <nav id="hTabs"></nav>
      <div id="hBody"></div>
      <footer><button class="hb big" id="hSleep"></button></footer>
    </div>
  </div>

  <!-- morning: one weapon + one ammo -->
  <div class="fo" id="fMorning" hidden>
    <div class="panel">
      <header><div class="ttl"><b>Morgen</b><small>Tag <span id="mDay">1</span></small></div></header>
      <div id="mWeapons"></div>
      <div id="mAmmo"></div>
      <footer><button class="hb big go" id="mGo"></button></footer>
    </div>
  </div>

  <!-- main menu: character card left, menu right, farm behind -->
  <div class="ov" id="menu">
    <div id="mMotes" aria-hidden="true"></div>
    <section id="mChar" class="rise r3">
      <input id="mName" maxlength="16" spellcheck="false" autocomplete="off" aria-label="Name">
      <div id="mStage"><div id="mGlow"></div><canvas id="mCanvas"></canvas><button id="mDice" aria-label="Zufall"></button></div>
      <div id="mOpts"></div>
    </section>
    <section id="mMain">
      <div id="mLogo" class="rise r1"><div class="mKicker"><svg class="mLeaf" viewBox="0 0 120 24" aria-hidden="true"><path d="M2 12h44M74 12h44" stroke="currentColor" stroke-width="1"/><path d="M60 3c-8 2-12 6-12 9 0 3 4 7 12 9 8-2 12-6 12-9 0-3-4-7-12-9z" fill="currentColor" opacity=".9"/><path d="M60 5v14" stroke="#05080b" stroke-width="1"/><circle cx="46" cy="12" r="1.6" fill="currentColor"/><circle cx="74" cy="12" r="1.6" fill="currentColor"/></svg></div><h1>Path<span>Of</span>Gardening</h1><div class="mRule"></div></div>
      <nav id="mNav" class="rise r2">
        <button class="mi main" id="playBtn">Spielen</button>
        <button class="mi" id="newBtn">Neues Spiel</button>
        <button class="mi" id="optBtn">Optionen</button>
      </nav>
      <div class="err" id="menuErr" hidden></div>
    </section>
  </div>

  <div class="ov" id="confirmNew" hidden>
    <h2>Neues Spiel</h2>
    <div class="row">
      <button class="btn" id="newYes">Neu starten</button>
      <button class="btn sec" id="newNo">Zurück</button>
    </div>
  </div>

  <div class="ov" id="options" hidden>
    <h2>Optionen</h2>
    <div class="col">
      <button class="btn sec" id="ctrlBtn">Steuerung</button>
      <button class="btn sec" id="qualBtn">Grafik</button>
      <button class="btn sec" id="sndBtn">Ton</button>
      <button class="btn sec" id="credBtn">Credits</button>
      <button class="btn" id="optBack">Zurück</button>
    </div>
  </div>

  <div class="ov" id="credits" hidden>
    <h2>Credits</h2>
    <div id="credView"></div>
    <button class="btn" id="credBack">Zurück</button>
  </div>

  <div class="ov" id="controls" hidden>
    <div class="tabs"><button class="tab" data-tab="pc">PC</button><button class="tab" data-tab="mobile">Mobil</button></div>
    <div id="ctrlView"></div>
    <button class="btn" id="ctrlBack">Zurück</button>
  </div>

  <div class="ov" id="pause" hidden>
    <h2>Pause</h2>
    <div class="col">
      <button class="btn" id="resumeBtn">Weiter</button>
      <button class="btn sec" id="pCtrlBtn">Steuerung</button>
      <button class="btn sec" id="pQualBtn">Grafik</button>
      <button class="btn sec" id="pSndBtn">Ton</button>
      <button class="btn sec" id="leaveBtn">Hauptmenü</button>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>

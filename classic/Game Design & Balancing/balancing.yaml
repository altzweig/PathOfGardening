# =====================================================================
#  PathOfGardening – Balancing
# ---------------------------------------------------------------------
#  Single Source of Truth. Das Spiel liest diese Datei bei JEDEM Start.
#  Lokal (npm run dev): Datei speichern -> Spiel lädt automatisch neu.
#  GitHub Pages: Datei committen + pushen -> wird mit ausgeliefert.
#
#  Einheiten: Zeit in Sekunden (s), Distanz in Metern (m, 1 m = 100 cm),
#  Winkel in Grad, Prozent als Anteil (0.15 = 15 %).
#  Im Koop wird gerechnet:  Faktor = Spielerzahl ^ Exponent
# =====================================================================


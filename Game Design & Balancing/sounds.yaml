# =====================================================================
#  PathOfGardening – Sounds
# ---------------------------------------------------------------------
#  Ereignis -> Sound-Dateien. Wird wie balancing.yaml beim Start gelesen.
#  files:  Clips aus public/audio/ (ohne .wav), pro Abspielen wird zufällig
#          einer gewählt (nie zweimal derselbe hintereinander)
#  vol:    Lautstärke 0..1
#  pitch:  [min, max] Abspielgeschwindigkeit (1 = original, 0.8 = tiefer)
#  gap:    Sekunden, bevor dasselbe Ereignis wieder klingen darf
#  synth:  zusätzlich ein im Code erzeugter Sound (z. B. hurt, ram, tongue)
#  chance: Wahrscheinlichkeit, dass der Sound überhaupt spielt (0..1)
#  delay:  [min, max] zufällige Verzögerung in s (macht Rufe unregelmäßiger)
#  rising: true = jede schnelle Wiederholung einen Halbton höher (Einsammel-Kette)
#  lp:     Tiefpass in Hz (kleiner = dumpfer)
#  Rohdateien liegen in sfx/<zweck>/ (ungenutzte in sfx/unused/), geschnittene Clips in public/audio/.
# =====================================================================

master: 0.9
distance: { full: 5, silent: 26 }   # m vom eigenen Spieler: bis "full" volle Lautstärke, ab "silent" stumm

ambient:
  night: { file: amb_night, vol: 0.18 }               # Grillen-Teppich (Loop)
  fire:  { file: amb_fire, vol: 0.10 }                # leises Feuerknistern der Fackeln (Loop)
  calls: { files: [crow_1, crow_2, crow_3, owl_1], vol: 0.16, pitch: [0.9, 1.05], every: [12, 28] }  # Rufe aus dem Wald

raccoon:
  # kurze Einzel-Laute, weich gefiltert
  wave:        { files: [rac_wave_1, rac_wave_2, rac_wave_3], vol: 0.32, pitch: [0.92, 1.08], gap: 0.5 }
  steal:       { files: [rac_steal_1, rac_steal_2, rac_steal_3], vol: 0.28, pitch: [0.95, 1.1], gap: 0.2 }
  flee:        { files: [rac_flee_1, rac_flee_2, rac_flee_3], vol: 0.3, pitch: [1.0, 1.12], gap: 0.4 }
  attack:      { files: [rac_attack_1, rac_attack_2, rac_attack_3, rac_hiss], vol: 0.26, pitch: [0.95, 1.08], gap: 0.5 }
  fieldAttack: { files: [rac_steal_1, rac_steal_2, rac_steal_3], vol: 0.18, pitch: [0.85, 0.95], gap: 0.7 }
  die:         { files: [rac_die_1, rac_die_2], vol: 0.3, pitch: [0.8, 0.92], gap: 0.15 }
  laugh:       { files: [rac_laugh_1, rac_laugh_2], vol: 0.45, pitch: [1.9, 2.1], gap: 2 }   # rennt mit Beute davon: keckerndes Lachen (doppelt so schnell + höher)

panda:
  # nutzt die Waschbär-Laute, etwas höher
  wave:        { files: [rac_wave_1, rac_wave_2, rac_wave_3], vol: 0.3, pitch: [1.12, 1.25], gap: 0.5 }
  steal:       { files: [rac_steal_1, rac_steal_2, rac_steal_3], vol: 0.26, pitch: [1.15, 1.3], gap: 0.2 }
  flee:        { files: [rac_flee_1, rac_flee_2, rac_flee_3], vol: 0.28, pitch: [1.15, 1.3], gap: 0.4 }
  attack:      { files: [rac_attack_1, rac_attack_2, rac_attack_3, rac_hiss], vol: 0.24, pitch: [1.1, 1.22], gap: 0.5 }
  fieldAttack: { files: [rac_steal_1, rac_steal_2, rac_steal_3], vol: 0.16, pitch: [1.0, 1.1], gap: 0.7 }
  die:         { files: [rac_die_1, rac_die_2], vol: 0.28, pitch: [0.95, 1.05], gap: 0.15 }
  laugh:       { files: [rac_laugh_1, rac_laugh_2], vol: 0.42, pitch: [2.1, 2.3], gap: 2 }

toad:
  wave:        { files: [toad_wave_1, toad_wave_2, toad_wave_3], vol: 0.1, pitch: [0.85, 1.1], gap: 20, chance: 0.75, delay: [0, 6] }   # Quaken im Hintergrund: leise, etwa 2-3x pro Minute
  attack:      { files: [toad_tongue_1, toad_tongue_2, toad_tongue_3], vol: 0.12, pitch: [0.9, 1.15], gap: 0.2, synth: tongue }
  fieldAttack: { files: [toad_tongue_1, toad_tongue_2, toad_tongue_3], vol: 0.08, pitch: [0.85, 1.0], gap: 0.4, synth: tongue }
  die:         { files: [toad_die_1, toad_die_2, toad_die_3], vol: 0.15, pitch: [0.75, 0.9], gap: 0.1 }

sheep:
  wave:        { files: [sheep_baa_1, sheep_baa_2, sheep_baa_3], vol: 0.25, pitch: [0.95, 1.1], gap: 0.6 }
  charge:      { files: [sheep_baa_1, sheep_baa_2, sheep_baa_3], vol: 0.35, pitch: [1.1, 1.3], gap: 0.2 }   # holt Anlauf
  ram:         { files: [wood_2, wood_4], vol: 0.5, pitch: [0.55, 0.7], gap: 0.1, synth: ram }
  shield:      { files: [shield_zap], vol: 0.25, pitch: [0.9, 1.2], gap: 0.3 }                    # Schild lädt neu
  die:         { files: [sheep_baa_2, sheep_baa_3], vol: 0.28, pitch: [0.7, 0.8], gap: 0.1 }

hedgehog:
  # Igel: nutzt vorerst Waschbär-Laute, sehr hoch und leise (Schnüffeln/Quieken); Aufplustern = kurzes Fauchen + Rascheln
  wave:        { files: [rac_wave_1, rac_wave_2, rac_wave_3], vol: 0.2, pitch: [1.6, 1.8], gap: 0.6 }
  steal:       { files: [berry_1, berry_2, berry_3, berry_4], vol: 0.14, pitch: [0.8, 0.95], gap: 0.25, lp: 2500 }   # frisst eine Beere
  attack:      { files: [rac_hiss, rip_1, rip_2], vol: 0.12, pitch: [1.4, 1.7], gap: 0.4 }                          # plustert sich auf
  fieldAttack: { files: [rip_1, rip_2, rip_3], vol: 0.1, pitch: [1.3, 1.5], gap: 0.6 }
  die:         { files: [rac_die_1, rac_die_2], vol: 0.24, pitch: [1.5, 1.7], gap: 0.15 }

player:
  step:   { files: [step_1, step_2, step_3, step_4], vol: 0.16, pitch: [0.85, 1.15], gap: 0.12 }
  hurt:   { synth: hurt, gap: 0.2 }
  die:    { synth: playerDie, gap: 1 }
  spawn:  { synth: respawn, gap: 0.5 }
  till:   { files: [rake_till_1, rake_till_2, rake_till_3, rake_till_4], vol: 0.3, pitch: [0.9, 1.1], gap: 0.1 }   # Feld beackern (Harke im Boden)

plants:
  produce:
    blue: { files: [berry_1, berry_2, berry_3, berry_4], vol: 0.18, pitch: [0.9, 1.15], gap: 0.12 }
    asp:  { files: [wood_1, wood_2, wood_3, wood_4, wood_5], vol: 0.3, pitch: [0.85, 1.05], gap: 0.15 }
    cran: { files: [berry_1, berry_2, berry_3, berry_4], vol: 0.18, pitch: [1.3, 1.6], gap: 0.12 }
    cab:  { files: [cab_1, cab_2, cab_3], vol: 0.4, pitch: [0.9, 1.15], gap: 0.15 }
    lemon: { files: [shield_zap], vol: 0.12, pitch: [1.7, 2.0], gap: 0.2 }          # Blitz zwischen den Zitronen
    chili: { synth: ember, gap: 0.4 }                                               # Lava-Atmen unter dem Chilifeld
  eaten:   # Gegner frisst an einem Feld
    blue: { files: [rip_1, rip_2, rip_3, rip_4, rip_5], vol: 0.3, pitch: [1.0, 1.25], gap: 0.3 }
    asp:  { files: [wood_1, wood_3, wood_5], vol: 0.3, pitch: [0.75, 0.9], gap: 0.3 }
    cran: { files: [rip_1, rip_2, rip_3, rip_4, rip_5], vol: 0.3, pitch: [1.2, 1.45], gap: 0.3 }
    cab:  { files: [cab_1, cab_2, cab_3], vol: 0.4, pitch: [0.8, 1.0], gap: 0.3 }
    lemon: { files: [wood_1, wood_3, wood_5], vol: 0.3, pitch: [0.9, 1.05], gap: 0.3 }
    chili: { files: [rip_1, rip_2, rip_3, rip_4, rip_5], vol: 0.3, pitch: [1.1, 1.3], gap: 0.3 }
  die:     # Feld zerstört
    blue: { files: [rip_2, rip_3], vol: 0.6, pitch: [0.55, 0.65], gap: 0.3, synth: wilt }
    asp:  { files: [wood_1, wood_4], vol: 0.6, pitch: [0.5, 0.6], gap: 0.3, synth: wilt }
    cran: { files: [rip_4, rip_5], vol: 0.6, pitch: [0.65, 0.75], gap: 0.3, synth: wilt }
    cab:  { files: [cab_1], vol: 0.7, pitch: [0.5, 0.6], gap: 0.3, synth: wilt }
    lemon: { files: [wood_2, wood_4], vol: 0.6, pitch: [0.55, 0.65], gap: 0.3, synth: wilt }
    chili: { files: [rip_4, rip_5], vol: 0.6, pitch: [0.6, 0.7], gap: 0.3, synth: wilt }

ui:
  click:       { files: [ui_click], vol: 0.35, pitch: [0.95, 1.05] }            # Knöpfe im Menü
  hover:       { files: [ui_hover], vol: 0.2, pitch: [0.95, 1.1], gap: 0.05 }  # Maus über Karte
  confirm:     { files: [ui_confirm], vol: 0.4 }                                # Karte gewählt, Feld gesetzt
  levelup:     { files: [levelup], vol: 0.5 }
  rarity:      { files: [rarity_up], vol: 0.5 }                                 # Feld steigt in der Seltenheit
  weaponReady: { files: [weapon_ready], vol: 0.25, gap: 0.3 }                   # Waffe hat genug Munition
  weaponCycle: { files: [weapon_cycle], vol: 0.3, pitch: [1.0, 1.1] }           # Leertaste
  gameOver:    { files: [game_over], vol: 0.6 }
  pauseIn:     { synth: pauseIn }                                               # Spiel wird langsamer bis zur Pause (Level-up, Menü)
  pauseOut:    { synth: pauseOut }                                              # Spiel läuft wieder an
  weaponSwap:  { synth: swap }                                                  # neue Waffe auf aktive Waffe gezogen

collect:
  xp:    { files: [collect_xp_1, collect_xp_2, collect_xp_3, collect_xp_4], vol: 0.14, pitch: [0.68, 0.68], rising: true, lp: 1600 }    # Blaubeeren
  ammo:  { files: [collect_ammo_1, collect_ammo_2, collect_ammo_3, collect_ammo_4], vol: 0.14, pitch: [0.72, 0.85], gap: 0.04, lp: 1500 } # Munition
  big:   { files: [collect_big], vol: 0.2, pitch: [0.72, 0.82], lp: 1800 }                 # große Frucht (Stufe 2/3)
  merge: { files: [merge], vol: 0.4, pitch: [0.9, 1.15], gap: 0.1 }              # 10 Früchte verschmelzen

effects:
  pool:  { files: [pool_1, pool_2, pool_3], vol: 0.3, pitch: [0.85, 1.1], gap: 0.15 }  # Kohl-Giftlache blubbert

weapons:
  lemon: { files: [shield_zap], vol: 0.3, pitch: [1.3, 1.6], gap: 0.05, lp: 5000 }   # Citrateaser-Kettenblitz
  # Flammenwerfer: Zünd-Stoß beim Losfeuern, durchgehendes Fauchen als Schleife, Ausklingen beim Loslassen
  chiliStart: { files: [flame_start_1, flame_start_2, flame_start_3, flame_start_4], vol: 0.45, pitch: [0.9, 1.1], gap: 0.15 }
  chiliLoop:  { file: flame_loop, vol: 0.32, pitch: [0.95, 1.05], fade: 0.15 }
  chiliEnd:   { files: [flame_end_1, flame_end_2], vol: 0.35, pitch: [0.95, 1.1], gap: 0.15 }

boss:
  spit: { files: [pool_1, pool_2, pool_3], vol: 0.35, pitch: [0.55, 0.75], gap: 0.06 }      # spuckt Blaubeer-Bomben
  boom: { files: [collect_big], vol: 0.35, pitch: [0.45, 0.6], gap: 0.05, synth: boomS }   # Blaubeer-Bombe explodiert

# =====================================================================
#  PathOfGardening – Balancing (Farming-Gameloop seit 19.11.2026)
# ---------------------------------------------------------------------
#  Single Source of Truth. Das Spiel liest diese Datei bei JEDEM Start.
#  Lokal (npm run dev): Datei speichern -> Spiel lädt automatisch neu.
#  GitHub Pages: Datei committen + pushen -> wird mit ausgeliefert.
#
#  Einheiten: Zeit in Sekunden (s), Distanz in Metern (m), Winkel in Grad,
#  Prozent als Anteil (0.15 = 15 %). Geld = Taler.
#  Die alten Werte (Wellen-Survival) liegen in archiv/garden-defence-v1/design/balancing.yaml.
#  Ablauf und Annahmen: Farming-Gameloop.md, Regeln: Design-Entscheidungen.md.
# =====================================================================

names:
  items:                     # Waren im Lager (Id: Anzeigename)
    blue: Blaubeeren
    wheat: Weizen            # Getreide, zugleich Saatgut
    straw: Stroh
    flour: Mehl
    bread: Brot
    nut: Nüsse
    garlic: Knoblauch
    asp: Spargel
    bean: Bohnen
    leek: Lauch
    carrot: Karotten
    lemon: Zitronen
    apple: Äpfel
    cab: Kohl
    pumpkin: Kürbis
    melon: Melone
    juice: Saft
    milk: Milch
    cheese: Käse
    egg: Eier
    plank: Bretter
  weapons:
    rake: Harke              # Notwaffe: ohne Waffe oder ohne Munition schlägt man schwertartig mit der Harke
    shotgun: Schrotflinte
    crossbow: Armbrust
    sling: Schleuder
    mace: Streitkolben
    cannon: Kanone
  buildings:
    house: Haupthaus
    well: Brunnen
    shop: Hofladen
    mill: Mühle
    bakery: Bäckerei
    carpentry: Schreinerei
    workshop: Werkstatt
    dairy: Molkerei
    juicer: Saftpresse
    silo: Güllesilo
    chickens: Hühnergehege
    cows: Kuhweide
    plot: Feld
  animals:
    raccoon: Waschbär
    hare: Hase

# ---------------------------------------------------------------------
day:
  length: 300              # s pro Tag (eine Welle = ein Tag, Basti: ca. 5 min)
  clock: [6, 20]           # angezeigte Uhrzeit von Tagesbeginn bis Abend (nur Sonnen-Uhr im HUD)
  light: [2.6, 16.0]       # Lichtstunde (2.6 = heller Morgen .. 16 = Sonnenuntergang) am Anfang und Ende des Tages
  fade: 1.4                # s Schwarzblende am Abend / bei Ohnmacht
  rain:                    # seltener Sommer-Gewitterschauer (gießt alle Felder und den Busch)
    chance: 0.15           # Wahrscheinlichkeit pro Tag (nicht am Tutorial-Tag)
    duration: [20, 32]     # s

player:
  hp: 100
  speed: 4.6               # m/s
  radius: 0.35             # m, Kollision
  reach: 1.7               # m bis zum Ziel, ab hier startet eine Aktion (sonst läuft die Figur erst hin)
  hover: 2.6               # m: Handy-Aktionsknopf nimmt das nächste Ziel in dieser Entfernung
  pickupRadius: 0.9        # m: fallengelassene Beute wird eingesammelt
  magnetRadius: 3          # m: ab hier rollt Beute zum Spieler
  magnetSpeed: 7           # m/s
  hurtStun: 0.25           # s kurzes Zusammenzucken bei einem Biss (bricht die Aktion ab)

# ---------------------------------------------------------------------
# Aktionen mit Linksklick: Dauer in s. Das passende Werkzeug + Animation kommt automatisch.
actions:
  water: 2.0               # Gießkanne: Busch oder Feld gießen
  rake: 3.5                # Harke: Feld harken
  sow: 2.5                 # Saatgutsack: säen
  harvestPlot: 3.0         # Sichel: Feld ernten
  refill: 2.5              # Gießkanne am Brunnen auffüllen

can:                       # Gießkanne
  capacity: 5              # Füllungen (eine Füllung = einmal gießen)
  start: 5                 # Tutorial-Tag: voll

bush:                      # Blaubeerbusch (jeden Tag): gießen -> reifen -> ernten -> leer
  ripen: 60                # s nach dem Gießen bis erntereif
  berries: 17              # Beeren pro Tag
  pickInterval: 3.5        # s pro Beere beim Ernten (17 Beeren ≈ 1 min Ernten)
  barDelay: 1              # s nach dem Gießen erscheint der dezente Reife-Balken
  almostAt: 0.75           # Anteil der Reifezeit: Tutorial-Hinweis "fast erntereif"

crops:                     # Feldfrüchte (jetzt nur Weizen): days = gegossene Tage bis reif, yield = Ernte
  wheat:
    seed: wheat            # verbraucht 1x diese Ware beim Säen
    days: 3
    yield: { wheat: 4, straw: 3 }

plots:
  size: 2.6                # m Kantenlänge eines Feldes
  byLevel: [1, 3, 5, 8, 11, 14, 18, 22, 24]   # so viele Felder darf man auf Level 1, 2, 3, ... anlegen
  cost: 20                 # Taler für ein weiteres Feld (Abend: Bauen)

storage:
  capacity: 999            # pro Ware (Lager-Ausbau kommt später)

start:                     # neuer Spielstand
  money: 15
  items: { wheat: 1 }      # 1x Weizen-Saatgut
  plots: 1                 # ein Feld

# ---------------------------------------------------------------------
# Kampf (Rechtsklick). Morgens wählt man genau eine Waffe und eine Munition.
weapons:
  rake:                    # Harke (Notwaffe, immer dabei)
    damage: 4
    range: 1.35            # m
    arc: 110               # Grad Trefferkegel
    cooldown: 0.5          # s
    swing: 0.2             # s Schwung (Treffer in der Mitte)
    knockback: 0.5         # m
    stun: 0.4              # s (Speed linear von 0 auf normal)
  shotgun:
    available: true
    level: 1
    ammo: [blue, wheat, nut, garlic]     # Beeren, Körner, Nüsse, Knoblauch
    ammoPerShot: 1
    cooldown: 0.7
    pellets: 6
    cone: 26               # Grad Streuung
    range: 7               # m
    speed: 20              # m/s Schrot
    damage: 2              # je Schrotkugel (x Munitionsfaktor)
  crossbow:                # vorbereitet, noch gesperrt
    available: false
    level: 4
    ammo: [asp, bean, leek, carrot]
  sling:
    available: false
    level: 3
    ammo: [garlic, nut, lemon, apple]
  mace:
    available: false
    level: 6
    ammo: [cab, pumpkin, melon]
  cannon:
    available: false
    level: 8
    ammo: [cab, pumpkin, melon]

ammo:                      # Wirkung je Munition: damage = Faktor auf den Waffenschaden, freeze = s eingefroren (Blaubeeren)
  blue: { damage: 1, freeze: 2.5 }
  wheat: { damage: 0.6 }
  nut: { damage: 1.4 }
  garlic: { damage: 1.1 }

# ---------------------------------------------------------------------
# Tiere: wenige, kleine Schübe. Sie werden nicht getötet, sondern vertrieben (0 Leben = Flucht in den Wald, XP).
animals:
  raccoon:
    hp: 12
    speed: 2.4             # m/s beim Anschleichen
    fleeSpeed: 3.4         # m/s auf der Flucht (langsamer als der Spieler)
    radius: 0.35
    stealInterval: 0.8     # s pro geklauter Ware
    carryMax: 5
    shy: 0.35              # Anteil scheuer Waschbären: hauen ab, sobald man näher als `scare` kommt
    scare: 3.5             # m
    aggro: 3               # m: mutige Waschbären greifen den Spieler an, wenn er so nah ist
    damage: 6              # pro Biss
    biteInterval: 1.2      # s
    biteRange: 0.85        # m
    xp: 8
  hare:
    hp: 6
    speed: 2.6
    fleeSpeed: 6.5
    radius: 0.25
    scare: 4.5             # m: flieht immer, sobald der Spieler näher kommt
    eatInterval: 2.5       # s pro gefressener Beere / Feldbiss
    plotBites: 3           # so viele Bisse kosten ein Feld einen Wachstumstag (reifes Feld: 1 Ware je Biss)
    xp: 3

spawns:
  firstAfter: 30           # s nach Tagesbeginn kommt der erste Schub
  lastBefore: 25           # s vor Tagesende kommt nichts mehr
  groups: 3                # Schübe pro Tag auf Level 1 ...
  groupsPerLevel: 0.5      # ... + je weiterem Level
  size: [1, 2]             # Tiere pro Schub (zufällig)
  sizePerLevel: 0.25       # + je weiterem Level (Obergrenze)
  types: { raccoon: 0.55, hare: 0.45 }   # Gewichte
  scaling:                 # Schwierigkeit steigt mit dem Level: + Anteil je Level über 1
    hp: 0.12
    damage: 0.1
    speed: 0.03

faint:                     # 0 Leben = ohnmächtig: man wacht abends auf, der Rest des Tages ist verloren
  dryFields: true          # alle heute gegossenen Felder sind wieder trocken

# ---------------------------------------------------------------------
levels:
  xp: [0, 30, 80, 150, 250, 380, 550, 760, 1000, 1300]   # XP ab Level 1, 2, 3, ...
  unlocks:                 # was ein Level freischaltet (Gebäude-Ids, zusätzliche Felder kommen über plots.byLevel)
    2: [mill]
    3: [shop, juicer]
    4: [bakery]
    5: [carpentry, workshop]
    6: [dairy, cows, chickens]
    7: [silo]

quests:
  offers: 2                # neue Angebote pro Abend
  maxActive: 3
  start:                   # Startauftrag, liegt vom ersten Abend an bereit
    need: { blue: 10 }
    reward: { money: 30, xp: 25, items: { wheat: 2 } }
  pool:                    # Zufallsaufträge: need = Ware, Menge [min, max], Taler + XP pro Stück, ab Level
    - { item: blue, amount: [6, 12], money: 2, xp: 2, level: 1 }
    - { item: wheat, amount: [3, 6], money: 4, xp: 4, level: 1 }
    - { item: straw, amount: [3, 6], money: 3, xp: 3, level: 1 }
    - { item: flour, amount: [2, 4], money: 9, xp: 7, level: 2 }
    - { item: bread, amount: [1, 3], money: 18, xp: 12, level: 4 }

buildings:                 # level = ab diesem Level baubar, cost = Taler + Waren, recipes = Verarbeitung (abends starten, am nächsten Abend abholen)
  house: { built: true }
  well:                    # Brunnen: kaputt, abends reparieren, dann Gießkanne auffüllen
    level: 1
    broken: true
    cost: { money: 40 }
  mill:
    level: 2
    cost: { money: 60, straw: 4 }
    recipes: [{ in: { wheat: 2 }, out: { flour: 1 }, days: 1 }]
  shop:
    level: 3
    cost: { money: 90, straw: 6 }
    questSlots: 1          # mehr Auftragsangebote
  juicer:
    level: 3
    cost: { money: 80 }
    recipes: [{ in: { blue: 6 }, out: { juice: 1 }, days: 1 }]
  bakery:
    level: 4
    cost: { money: 120, straw: 6 }
    needs: well
    recipes: [{ in: { flour: 1 }, out: { bread: 1 }, days: 1 }]
  carpentry:
    level: 5
    cost: { money: 150 }
  workshop:
    level: 5
    cost: { money: 180 }
  dairy:
    level: 6
    cost: { money: 200 }
    needs: cows
    recipes: [{ in: { milk: 2 }, out: { cheese: 1 }, days: 1 }]
  cows:
    level: 6
    cost: { money: 160, straw: 10 }
  chickens:
    level: 6
    cost: { money: 120, wheat: 6 }
  silo:
    level: 7
    cost: { money: 220 }

# ---------------------------------------------------------------------
# Tutorial-Tag (erster Tag). Texte: die einzige erlaubte Erklärung im Spiel.
loading:                   # Ladebildschirm beim Start: Vorschaubild, Ladebalken, Tipps
  minTime: 2.5             # s, so lange bleibt er mindestens stehen
  tipEvery: 5              # s, dann kommt der nächste Tipp
  fade: 0.6                # s Ausblenden
  tips:                    # zufällige Reihenfolge, Ausnahme von "keine Erklärtexte" (Basti 19.11.2026)
    - Felder brauchen jeden Tag einmal Wasser. Ungegossene Tage zählen nicht.
    - Die Gießkanne füllst du am Brunnen auf.
    - Regen gießt alle Felder und den Busch.
    - Waschbären klauen aus dem Korb am Lager. Triff sie, dann lassen sie die Beute fallen.
    - Hasen sind scheu. Geh auf sie zu, dann flüchten sie in den Wald.
    - Tiere kommen nur durch die Lücken im Wald.
    - Ohne Waffe kämpfst du mit der Harke.
    - Blaubeeren als Munition frieren Tiere kurz ein.
    - Unbenutzte Munition kommt abends zurück ins Lager.
    - XP gibt es für Aufträge und vertriebene Tiere.
    - Mit jedem Level schaltest du neue Gebäude frei.
    - Weizen erntest du mit der Sichel und bekommst Weizen und Stroh.
    - Abends im Haus nimmst du Aufträge an und gibst sie ab.
    - Fällst du in Ohnmacht, ist der Tag vorbei und die Felder sind wieder trocken.

tutorial:
  raccoonHp: 4             # ein Harkenschlag vertreibt ihn
  raccoonSteal: 5          # klaut so viele Beeren aus dem Korb
  raccoonSpeed: 3.0        # m/s auf der Flucht (Spieler 4,6)
  raccoonStart: 3          # m neben dem Spieler startet die Flucht nach der Cutscene
  fieldHint: 6             # s bleibt der Hinweis "jeden Tag gießen" stehen
  texts:
    water: Blaubeeren gießen
    waterHere: Gießen
    meanwhile: In der Zwischenzeit das Feld harken, säen und gießen
    rake: Harken
    sow: Säen
    waterField: Gießen
    daily: Felder jeden Tag einmal gießen. In 3 Tagen ist der Weizen reif.
    almost: Die Blaubeeren sind fast reif
    harvest: Ernten
    hunger: Hunger!
    intruder: Vertreib den Eindringling!
    fight: Kämpfen
    enough: Ganz schön viel für den ersten Tag.

# ---------------------------------------------------------------------
# Hof-Layout nach Bastis Skizze (19.11.2026). x nach rechts, z nach unten (Bildschirm), Mitte = Hofmitte, 1 Einheit = 1 m.
# rot = Drehung in Grad im Uhrzeigersinn (von oben gesehen). w = Breite (x), d = Tiefe (z).
hof:
  clearing: { rx: 22, rz: 16 }     # Lichtung (Ellipse), außen Wald
  gaps: [-100, -22, 42, 122, 182]  # Waldlücken (rote Pfeile, Grad: 0 = rechts, 90 = unten), nur hier kommen Tiere
  gapWidth: 5
  door: { x: 6.0, z: -6.2 }        # Spieler startet vor der Haustür
  basket: { x: 3.0, z: -6.6 }      # Korb am Lager (neben dem Haus), hier landet die Ernte
  bush: { x: 0.2, z: -5.0 }        # Blaubeerbusch
  buildings:
    house:     { x: 7.4, z: -9.4, w: 8.4, d: 5.2, rot: 18 }
    shop:      { x: 12.9, z: -6.9, w: 3.2, d: 3.6, rot: 18 }
    mill:      { x: 1.4, z: -11.2, w: 3.4, d: 3.4, rot: 20 }
    bakery:    { x: -5.0, z: -10.0, w: 4.2, d: 3.2, rot: -35 }
    well:      { x: -1.6, z: -7.0, r: 0.9 }
    carpentry: { x: -12.6, z: -6.6, w: 4.0, d: 3.4, rot: -20 }
    workshop:  { x: -14.2, z: 6.0, w: 3.6, d: 3.4, rot: 10 }
    juicer:    { x: 17.0, z: 1.8, w: 3.0, d: 3.0, rot: -10 }
    dairy:     { x: -9.0, z: 10.6, w: 3.8, d: 3.0, rot: 25 }
    cows:      { x: -3.6, z: 11.0, w: 5.0, d: 3.6, rot: 0, fence: true }
    silo:      { x: 2.2, z: 10.2, r: 1.8 }
    chickens:  { x: 7.4, z: 10.4, w: 5.0, d: 3.4, rot: 0, fence: true }
  plots:                           # Feldflächen (schwarz in der Skizze), Reihenfolge = Reihenfolge beim Anlegen
    - { x: -1.5, z: -1.6 }
    - { x: 1.5, z: -1.6 }
    - { x: -4.5, z: -1.6 }
    - { x: 4.5, z: -1.6 }
    - { x: -1.5, z: 1.4 }
    - { x: 1.5, z: 1.4 }
    - { x: -4.5, z: 1.4 }
    - { x: 4.5, z: 1.4 }
    - { x: -1.5, z: 4.4 }
    - { x: 1.5, z: 4.4 }
    - { x: -4.5, z: 4.4 }
    - { x: 4.5, z: 4.4 }
    - { x: -12.6, z: -1.6 }
    - { x: -9.6, z: -1.6 }
    - { x: -12.6, z: 1.4 }
    - { x: -9.6, z: 1.4 }
    - { x: 11.4, z: -2.2 }
    - { x: 14.4, z: -2.2 }
    - { x: 11.4, z: 0.8 }
    - { x: 14.4, z: 0.8 }
    - { x: 11.4, z: 3.8 }
    - { x: 14.4, z: 3.8 }
    - { x: -6.8, z: 7.6 }
    - { x: 12.0, z: 6.8 }
  trees:                           # Bäume (braune Kreise in der Skizze)
    - { x: -8.2, z: -12.6 }
    - { x: -16.0, z: -4.2 }
    - { x: -15.2, z: 1.8 }
    - { x: -11.6, z: 7.6 }
    - { x: -7.4, z: 13.0 }
    - { x: 4.4, z: -13.4 }
    - { x: 15.2, z: -9.6 }
    - { x: 18.6, z: -2.4 }
    - { x: 16.2, z: 8.2 }

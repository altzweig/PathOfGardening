ui:
  click:       { files: [ui_click], vol: 0.35, pitch: [0.95, 1.05] }            # Knöpfe im Menü
  hover:       { files: [ui_hover], vol: 0.2, pitch: [0.95, 1.1], gap: 0.05 }  # Maus über Karte
  confirm:     { files: [ui_confirm], vol: 0.4 }                                # Karte gewählt, Feld gesetzt
  levelup:     { files: [levelup], vol: 0.5 }
  rarity:      { files: [rarity_up], vol: 0.5 }                                 # Feld steigt in der Seltenheit
  weaponReady: { files: [weapon_ready], vol: 0.25, gap: 0.3 }                   # Waffe hat genug Munition
  weaponCycle: { files: [weapon_cycle], vol: 0.3, pitch: [1.0, 1.1] }           # Leertaste
  gameOver:    { files: [game_over], vol: 0.6 }
  pauseIn:     { synth: pauseIn }                                               # Spiel wird langsamer bis zur Pause (Level-up, Menü)
  pauseOut:    { synth: pauseOut }
  page:        { synth: page }                                                  # Umblättern im Haus-Buch                                              # Spiel läuft wieder an
  coins:       { synth: coins }                                                 # Auftrag im Haus-Buch abgeholt (Münzen fliegen)
  drop:        { synth: drop }                                                  # Ware landet im Verkaufs-Slot des Hofladens
  sale:        { synth: sale }                                                  # Sale-Preis gewählt
  premium:     { synth: premium }                                               # Premium-Preis gewählt

collect:
  xp:    { files: [bb_collect_1, bb_collect_2, bb_collect_3, bb_collect_4], vol: 0.16, pitch: [0.95, 1.04], rising: true, lp: 2200 }    # Blaubeeren einsammeln (aus blueberry.mp3: dumpf, kurz, leicht tiefer)
  ammo:  { files: [collect_ammo_1, collect_ammo_2, collect_ammo_3, collect_ammo_4], vol: 0.14, pitch: [0.72, 0.85], gap: 0.04, lp: 1500 } # Munition
  big:   { files: [collect_big], vol: 0.2, pitch: [0.72, 0.82], lp: 1800 }                 # große Frucht (Stufe 2/3)
  merge: { files: [merge], vol: 0.4, pitch: [0.9, 1.15], gap: 0.1 }              # 10 Früchte verschmelzen

effects:
  pool:  { files: [pool_1, pool_2, pool_3], vol: 0.3, pitch: [0.85, 1.1], gap: 0.15 }  # Kohl-Giftlache blubbert

weapons:
  lemon: { files: [shield_zap], vol: 0.3, pitch: [1.3, 1.6], gap: 0.05, lp: 5000 }   # Citrateaser-Kettenblitz
  # Flammenwerfer: Zünd-Stoß beim Losfeuern, durchgehendes Fauchen als Schleife, Ausklingen beim Loslassen
  chiliStart: { files: [flame_start_1, flame_start_2, flame_start_3, flame_start_4], vol: 0.45, pitch: [0.9, 1.1], gap: 0.15 }
  chiliLoop:  { file: flame_loop, vol: 0.32, pitch: [0.95, 1.05], fade: 0.15 }
  chiliEnd:   { files: [flame_end_1, flame_end_2], vol: 0.35, pitch: [0.95, 1.1], gap: 0.15 }

boss:
  spit: { files: [pool_1, pool_2, pool_3], vol: 0.35, pitch: [0.55, 0.75], gap: 0.06 }      # spuckt Blaubeer-Bomben
  boom: { files: [collect_big], vol: 0.35, pitch: [0.45, 0.6], gap: 0.05, synth: boomS }   # Blaubeer-Bombe explodiert


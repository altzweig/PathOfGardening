  slash:  { synth: whoosh, gap: 0.08 }                                                                            # Schwung mit der Hacke (comicartiges Wusch)

can:                                                  # Gießkanne (21.11.2026, Freesound, geschnitten mit tools/build-can.py)
  pour:   { files: [can_pour_1, can_pour_2, can_pour_3], vol: 0.55, pitch: [0.96, 1.03] }   # Gießen: Plätschern aus nokta (gut 1 Halbton tiefer) + leise, tiefpassgefiltert wobesound

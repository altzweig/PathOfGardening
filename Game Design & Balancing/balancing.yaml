# =====================================================================
#  PathOfGardening – Balancing
# ---------------------------------------------------------------------
#  Single Source of Truth. Das Spiel liest diese Datei bei JEDEM Start.
#  Lokal (npm run dev): Datei speichern -> Spiel lädt automatisch neu.
#  GitHub Pages: Datei committen + pushen -> wird mit ausgeliefert.
#
#  Einheiten: Zeit in Sekunden (s), Distanz in Metern (m, 1 m = 100 cm),
#  Winkel in Grad, Prozent als Anteil (0.15 = 15 %).
#  Im Koop wird gerechnet:  Faktor = Spielerzahl ^ Exponent
# =====================================================================

names:
  skills:
    rake: Harke
    asp: Spargelgewehr
    cran: Preiselbeer-Schrotflinte
    cab: Kohlbombe
    lemon: Citrateaser
  plants:            # Pflanze (Doppelernte-Karte)
    blue: Blaubeerbusch
    asp: Spargel
    cran: Preiselbeeren
    cab: Kohl
    lemon: Zitronenbäumchen
  fields:            # Feld (Neues-Feld-Karte)
    blue: Blaubeerfeld
    asp: Spargelfeld
    cran: Preiselbeerfeld
    cab: Kohlfeld
    lemon: Zitronenbäumchen
  tea: Kräutertee
  care: Feldpflege          # Upgrade: Beackern heilt das Feld

player:
  hp: 100
  speed: 4.6               # m/s
  respawnBase: 1           # s bis zur ersten Wiederbelebung
  respawnPerDeath: 1       # s zusätzlich pro weiterem Tod (1 s, 2 s, 3 s, ...)
  pickupRadius: 1.0        # m, ab hier wird eine Frucht eingesammelt
  pickupPerTier: 0.12      # m, große Früchte (Stufe 2/3) von etwas weiter
  magnetRadius: 1.8        # m, ab hier rollt eine Frucht zum Spieler
  magnetSpeed: 2.8         # m/s

coop:
  maxPlayers: 4
  # Faktor = Spielerzahl ^ Exponent.  0.5 = Wurzel, 1 = linear, 0 = aus.
  #                           2 Spieler   3 Spieler   4 Spieler
  xpNeedExponent: 1.0       #  x2,00       x3,00       x4,00   benötigte XP pro Stufe
  enemyCountExponent: 0.5   #  x1,41       x1,73       x2,00   Gegner pro Stoß
  enemyHpExponent: 0.5      #  x1,41       x1,73       x2,00   Gegner-HP (inkl. Schaf-Schild)
  xpYieldExponent: 0.5      #  x1,41       x1,73       x2,00   Blaubeer-Wachstum (Menge)
  xpValueExponent: 0.5      #  x1,41       x1,73       x2,00   XP pro Blaubeere
  enemyDamageExponent: 0.0  #  x1          x1          x1      Gegnerschaden
  snapshotRate: 20          # Netz-Updates pro Sekunde vom Host

xp:
  # Benötigte XP für Stufe L:  round(base * growth^(L-1) + linear * (L-1))
  base: 40
  growth: 1.05             # flachere Kurve (vorher 1.1)
  linear: 5

arena:
  radius: 15               # m, begehbarer Bereich
  fieldSize: 3             # m, Feld-Durchmesser (Ecke zu Ecke), Felder liegen lückenlos im Hex-Raster
  fieldSlots: 20           # max. Anzahl Feldplätze (die innersten Hex-Plätze um die Mitte)
  startFields: 3           # Blaubeerfelder zu Beginn

fields:
  hp: 100
  healPerSecond: 1         # HP/s für das Feld, auf dem ein Spieler mit seinem Mittelpunkt steht
  tillHealField: 1         # HP/s, die Beackern dem Feld gibt (Feldpflege-Upgrade erhöht das)
  tillHealPlayer: 1        # HP/s, die Beackern dem beackernden Spieler und Mitspielern auf dem Feld gibt
  # Die 3 Startfelder sind unzerstörbar, solange noch ein anderes Feld lebt.
  # Beackern: Harke benutzen, wenn kein Gegner im Kegel ist und 1 m vor dem Spieler ein Feld liegt
  tillReach: 1.0           # m vor dem Spieler
  tillDuration: 1.0        # s, so lange gilt das Feld nach einem Harkenstoß als beackert
  tillMultiplier: 2        # Produktion x2 während es beackert wird (nur 1 Feld pro Spieler gleichzeitig)
  # Felder sind flach: Spieler und Gegner laufen einfach drüber.
  # Seltenheit: Feld desselben Typs auf ein Feld bauen -> Fortschritt zur nächsten Stufe.
  rarityNames: [Gewöhnlich, Ungewöhnlich, Selten, Episch, Legendär]
  rarityCost: [1, 2, 3, 4]     # Felder, die für Stufe 1->2, 2->3, 3->4, 4->5 draufgebaut werden müssen
  rarityProduction: 1.5        # Produktion x1,5 je Seltenheitsstufe (multiplikativ)
  rarityHp: 2                  # max. HP x2 je Seltenheitsstufe (Feld wird beim Aufstieg voll geheilt)
  neighborBonus: 0.10          # +10 % Produktion für jedes angrenzende Feld je Seltenheitsstufe des Nachbarn (additiv)

fruit:
  tierScale: [1, 1.75, 2.7]   # Größe Stufe 1/2/3
  tierValue: [1, 10, 100]     # Wert Stufe 1/2/3
  mergeCount: 10              # so viele gleiche Früchte verschmelzen zur nächsten Stufe
  mergeCheck: 0.4             # s zwischen Verschmelz-Prüfungen
  cornerScatter: 0.45         # m, Früchte fallen so weit um die Feldecke, an der der Rand-Impuls ankommt

plants:
  blue: { interval: 1 }                 # 1 Frucht alle x s
  asp:  { interval: 4, unlockAt: 15, amount: 3 }   # unlockAt: gesammelt -> Skill wird angeboten; amount: Früchte pro Ernte (3x Ertrag)
  cran: { interval: 1, unlockAt: 60, amount: 3 }   # 3x Ertrag
  cab:  { interval: 3.2, unlockAt: 8 }   # Produktion x2,5 (vorher interval 8)
  lemon: { interval: 3, unlockAt: 10, amount: 1, minLevel: 10 }   # Zitronenbäumchen: erst ab Level 10 als neuer Feldtyp

rake:
  damage: 10
  range: 1.8               # m (Prototyp: 1.0 -> +50 %)
  arc: 90                  # Grad, Breite des Kegels
  cooldown: 0.5            # s
  swingTime: 0.15          # s, Animation
  knockback: 0             # m Rückstoß pro Treffer (Upgrade +10 cm)

skills:
  readySeconds: 3          # "bereit", wenn Munition für x s Dauerfeuer da ist
  asp:
    damage: 15
    range: 7.5             # m (vorher 5 -> +50 %)
    cooldown: 0.25         # doppelte Feuerrate (vorher 0.5)
    ammoPerShot: 1
    speed: 15              # m/s
    pierce: 1              # durchbohrte Ziele zu Beginn
    pierceFactor: 0.5      # Schaden nach jedem Durchbohren x 0.5
    width: 0.3             # m Trefferbreite des Geschosses (vorher 0.1 -> 3x breiter)
  cran:
    damage: 5              # je Projektil
    range: 6.75            # m (4,5 -> +50 %)
    cooldown: 0.5          # +50 % Feuerrate (vorher 0.75)
    ammoPerShot: 6
    pelletStep: 10         # Grad zwischen zwei Beeren: 50 Grad Fächer -> 6 Beeren
    spread: 50             # Grad, Fächer (gleichmäßig verteilt)
    bleedDuration: 3       # s
    bleedDps: 1
    mineLifetime: 15       # s
  lemon:                   # Citrateaser: Kettenblitz, trifft immer genau 1 Ziel direkt
    damage: 16             # Grundschaden am ersten Ziel
    cooldown: 1.0          # 1 Angriff pro Sekunde
    ammoPerShot: 1
    range: 6               # m bis zum ersten Ziel
    chainRadius: 2.5       # m, so weit springt der Blitz weiter
    transfer: 0.5          # Weiterleitung je Kettenglied (50 % -> 25 %)
    branch: [1, 2, 2]      # Ziele: Hauptziel, je Glied 2 weitere, je davon 2 weitere = max 100 % + 2x50 % + 4x25 % = 300 %
    dropLoot: true         # das erste getroffene Tier lässt seine Beute fallen
  cab:
    damage: 5
    radius: 1.8            # m, Explosionsradius
    cooldown: 1.0
    ammoPerShot: 1
    throwDistance: 0.5     # m
    fuse: 0.8                # s bis zur Explosion
    poolDuration: 3        # s, Giftlache nach der Explosion (Radius = Explosionsradius)
    poolTicksPerSecond: 2
    poolTickDamage: 0.10   # Anteil des Kohlschadens pro Tick (3 s x 2/s x 10 % = 60 %)
    poolSlow: 0.35         # Gegner in der Lache 35 % langsamer
    miniRadiusFactor: 0.9  # Mini-Kohl: Radius x 0.5
    miniDamageFactor: 0.5  # Mini-Kohl: Schaden x 0.5

upgrades:
  offersPerLevel: 3
  damagePerLevel: 0.10     # +10 % Schaden je Stufe (additiv)
  rangePerLevel: 0.10      # +10 % Reichweite / Radius je Stufe (additiv)
  cooldownPerLevel: 0.10   # Abklingzeit x 0.9 je Stufe (multiplikativ)
  aspPierce:      { step: 1,    max: 4 }       # max = Gesamtzahl Ziele
  aspPierceBonus: { step: 0.10, maxLevel: 5 }  # +10 Prozentpunkte Durchbohr-Schaden (50 -> 100 %)
  aspSize:        { step: 0.30, maxLevel: 5 }  # Spargel-Geschoss +30 % größer (Breite)
  rakeArc:        { step: 20,   maxLevel: 10 } # Harke +20 Grad Kegelbreite
  rakeRange:      { step: 0.20, maxLevel: 10 } # Harke +20 cm Reichweite (absolut, in m)
  rakeDamage:     { step: 0.20, maxLevel: 10 } # Harke +20 % Grundschaden (additiv)
  rakeKnockback:  { step: 0.10, maxLevel: 10 } # Harke +10 cm Rückstoß
  tillHeal:       { step: 1, maxLevel: 5, weight: 1.2 }  # Feldpflege: +1 HP/s je Stufe auf Feld- UND Spieler-Heilung beim Beackern; Ziehgewicht 1,2
  lemonTargets:   { maxLevel: 3, order: [2, 1, 0] }      # +1 Ziel: erst 3. Glied, dann 2. Glied, dann Hauptziel
  lemonTransfer:  { step: 0.10, maxLevel: 4 }            # +10 % Weiterleitung (50 -> 60 %, 2. Glied 36 %)
  cranPellets:    { step: 1,    maxLevel: 3 }
  cranMine:       { step: 0.2,  maxLevel: 5 }  # Chance, dass eine Beere als Mine liegen bleibt
  cabMini:        { step: 1,    maxLevel: 5 }
  doubleHarvest:  { step: 0.25, maxLevel: 4 }  # max 100 %
  # Kartenregeln pro Level-up (3 Karten):
  fieldCardsPerLevel: 1    # immer 1 Feld-Karte: Feld eines vorhandenen Typs (bauen/hochleveln), Doppelernte oder Feldpflege
  weaponCardsMax: 2        # höchstens 2 Waffen-Karten (Freischalten + Upgrades, inkl. Harke)
  newFieldTypeEvery: 5     # alle 5 Level: neue Feldtypen zur Wahl statt der normalen Feld-Karte
  newFieldTypeChoices: 2   # so viele verschiedene neue Typen (wenn noch vorhanden)
  firstUpgradeNewField: true   # 1. Level-up: 2 neue Feldtypen zur Wahl + alternativ ein weiteres Blaubeerfeld
  secondUpgradeWeapon: true    # 2. Level-up: Waffe zum neuen Feld (ohne Sammel-Bedingung) + Harken-Verbesserungen
  repeatWeight: 0.25       # jede schon genommene Karte: Ziehgewicht +25 % (z. B. 2x Spargel-Reichweite -> x1,5)
  herbalTea: { playerHeal: 40, fieldHeal: 25 } # Notfall-Karte, wenn nichts anderes übrig ist

enemies:
  aggroRadius: 5           # m, ab hier greifen Gegner Spieler statt Felder an
  maxAlive: 60             # Obergrenze gleichzeitig (x Koop-Anzahl-Faktor), verdoppelt
  meleeDamage: 1
  meleeInterval: 1         # s
  xpDrop: 1                # jeder besiegte Gegner lässt so viele Blaubeeren (XP) fallen
  elite:                   # Elite-Gegner: größer, roter Leuchtrand
    fromWave: 3            # ab dieser Welle möglich
    chanceStart: 0.04      # Anteil Elite in dieser Welle
    chancePerWave: 0.01    # + je weitere Welle
    chanceMax: 0.25
    scale: 1.35            # Größe
    hp: 3                  # x Leben
    damage: 2              # x Angriffsstärke
    xpMultiplier: 5        # x XP-Drop
  boss:                    # Waschbär-Boss (vorerst der einzige Boss)
    every: 5               # alle 5 Wellen, kommt zu Beginn der Welle
    scale: 2.4
    hpEnemies: 20          # Leben = so viel wie 20 normale Waschbären ...
    hpGrowthPerWave: 0.06  # ... +6 % je Welle ab der ersten Boss-Welle
    speed: 2.2
    meleeDamage: 3
    xpDrop: 30
    collectTime: 5         # s Blaubeeren sammeln
    chargeTime: 2          # s aufladen (Warnung), dann Spezialattacke
    berryBonus: 0.03       # +3 % mehr Bomben je gesammelter Blaubeere
    bombDamage: 8
    bombRadius: 1.1        # m
    bombFuse: 0.7          # s leuchtender Kreis am Boden, dann Explosion
    trail:                 # Attacke 1: verfolgende Spur
      count: 14
      interval: 0.12       # s zwischen zwei Bomben
      speedNear: 4         # m/s des Spur-Kopfes in Spielernähe
      speedFar: 7          # m/s wenn der Spieler weit weg ist (schneller als der Spieler)
      farDistance: 6
      turnRate: 1.6        # rad/s, träge bei Richtungswechsel
    carousel:              # Attacke 2: dreht sich, spuckt 3 Spuren in zufällige Richtungen
      duration: 6
      every: 1             # s
      trails: 3
      count: 7             # Bomben pro Spur
      spacing: 0.9         # m
    rain:                  # Attacke 3: Blaubeer-Regen
      count: 30
      interval: 0.1
      warn: 0.5            # s zum Ausweichen
      radius: 10           # m um die Gartenmitte
  raccoon: { hp: 7, speed: 2.75, radius: 0.32, steals: [blue], carryMax: 5, fleeSpeed: 6.2 }
  panda:   { hp: 11, speed: 2.2,  radius: 0.34, steals: [cran, asp], carryMax: 5, fleeSpeed: 3.2 }
  toad:
    hp: 6
    speed: 2.1
    radius: 0.30
    hopPeriod: 1           # s pro Sprung (halbe Zeit in der Luft = unverwundbar)
    tongueCooldown: 1.5
    tongueRange: 1.5
    poisonTicks: 3
    poisonInterval: 2
    poisonDamage: 1
  sheep:
    maxAlive: 5            # höchstens so viele Schafe gleichzeitig
    hp: 3
    speed: 1.7
    radius: 0.44
    shield: 6
    shieldRegen: 3         # s bis Schild wieder voll
    chargeRange: 4.5       # m, ab hier holt es Anlauf
    windup: 2
    chargeSpeed: 9
    chargeTime: 0.8
    ramDamage: 4
    ramStun: 1
    knockback: 3           # m
    rest: 2

waves:
  # Gegner kommen in WELLEN. Eine Welle besteht aus mehreren Gruppen (Stößen) aus mehreren Richtungen.
  # Die Welle ist vorbei, sobald ihre letzte Gruppe gestartet ist UND mindestens endKilled ihrer Gegner
  # besiegt (oder geflohen) sind. Dann folgt eine feste Pause, danach startet die nächste Welle.
  total: 50                # Wellen bis zum Sieg
  firstWave: 4             # s bis zur ersten Welle
  spawnRadius: 15.5        # m vom Zentrum: Gegner kommen aus den Büschen
  firstWaveEnemies: 5      # Welle 1: genau so viele Gegner (nur Waschbären)
  durationStart: 20        # s Dauer von Welle 1 (Zeit von erster bis letzter Gruppe)
  durationPerWave: 2.5     # s länger je Welle
  endKilled: 0.9           # Anteil der Gegner der Welle, die weg sein müssen, damit die Welle endet
  pauseStart: 15           # s Pause nach jeder Welle (fest)
  pausePerWave: 0          # s längere Pause je Welle
  gapStart: 6              # s zwischen zwei Gruppen in Welle 1
  gapPerWave: 0.06         # s kürzer je Welle
  gapMin: 3                # s, kürzester Abstand
  gapJitter: 0.25          # +-25 % Zufall auf den Abstand
  sizeStart: 3             # Gegner pro Gruppe in Welle 1 (Grundwert)
  sizePerWave: 0.8         # + Gegner pro Gruppe je Welle
  sizeMax: 24
  rampFrom: 0.5            # innerhalb der Welle: erste Gruppe = 50 % der Grundgröße ...
  rampTo: 1.5              # ... letzte normale Gruppe = 150 %
  finalMultiplier: 2.5     # Schlussgruppe am Ende der Welle = 250 %
  directionsStart: 1       # Richtungen pro Gruppe in Welle 1
  directionsMax: 4
  directionEveryWaves: 3   # alle 3 Wellen eine Richtung mehr möglich
  directionSpread: 20      # Grad Streuung innerhalb einer Richtung
  staggerMin: 0.15         # s zwischen zwei Gegnern derselben Richtung
  staggerMax: 0.35
  warnTime: 1.5            # s vorher blinzeln Augen in dieser Richtung
  types:                   # ab welcher Welle ein Tier mitkommt, und wie häufig
    raccoon: { from: 1,  weight: 3 }
    panda:   { from: 4,  weight: 2, early: 1 }   # early: Gewicht schon vor "from", sobald Spargel- oder Preiselbeerfeld steht (ab Welle 2)
    toad:    { from: 7,  weight: 1.2 }
    sheep:   { from: 11, weight: 0.4 }

hud:
  hat:                     # Leben = Strohhut, der angefressen wird
    colors:                # [Leben-Anteil, Farbe] – dazwischen wird gemischt
      - [1.00, "#b8d040"]  # grüngelb, voll
      - [0.70, "#e6cf3a"]  # gelb
      - [0.45, "#e8902c"]  # orange
      - [0.25, "#d8442a"]  # rot
      - [0.10, "#9e0f12"]  # tiefrot
    crownShare: 0.65       # Anteil des Lebens, der den Hut-Kopf von oben frisst; der Rest frisst die Krempe
    blinkBelow: 0.10       # darunter blinkt der Hut leicht
    pulseBelow: 0.05       # darunter pulsiert er stärker + rote Bildschirmränder
    vignetteBelow: 0.05
    vignetteStrength: 0.35 # 0..1, bewusst dezent
  ammo:                    # Munitionsanzeige der aktiven Waffe
    showOnSwitch: 1.5      # s sichtbar nach Waffenwechsel
    lowSeconds: 3          # "geht zur Neige": wenn nur noch so viele Sekunden Dauerfeuer übrig sind
    lowShow: 1.0           # s sichtbar bei "geht zur Neige"
    fade: 0.3              # s Ein-/Ausblenden
